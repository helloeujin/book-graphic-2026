<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-3 긴 레이블</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .chart-title { font-size: 15px; line-height: 21px; font-weight: 700; color: #1a1a1a; }
  .chart-sub { font-size: 12px; line-height: 16px; color: #777777; margin-top: 2px; margin-bottom: 8px; }
  .sub { margin-bottom: 14px; }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 8px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 13px; color: #363636; }
  .legend-item i { width: 14px; height: 2px; display: inline-block; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>긴 이름을 대각선으로 돌림</span></div>
      <div class="sub" id="rot">
        <p class="chart-title">유입 채널별 신규 가입자 수</p>
        <p class="chart-sub">2025년 상반기</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>가로 막대로 바꿔 이름을 가로로</span></div>
      <div class="sub" id="hor">
        <p class="chart-title">유입 채널별 신규 가입자 수</p>
        <p class="chart-sub">2025년 상반기</p>
      </div>
    </div>
  </div>
  <p class="source">유입 채널별 신규 가입자 수, 예시 데이터. 두 차트는 같은 데이터를 사용하고 막대의 방향만 다릅니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 240;
const BLUE = '#0b66d6';

// 예시 데이터: 유입 채널별 신규 가입자 수(명)
const DATA = [
  { k: '검색 키워드 광고', v: 1240 },
  { k: '소셜 미디어 인플루언서', v: 980 },
  { k: '온라인 쇼핑몰 배너', v: 860 },
  { k: '오프라인 매장 이벤트', v: 640 },
  { k: '이메일 뉴스레터', v: 410 },
  { k: '제휴사 공동 프로모션', v: 280 }
];
const vTicks = [0, 500, 1000, 1500];
const fmt = d => d === 1500 ? '1,500명' : d3.format(',')(d);

function axisStyle(sel, color) {
  sel.call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', color || '#999999').style('font-family', FONT);
}

function vertical(sel) {
  const margin = { top: 12, right: 8, bottom: 118, left: 52 };
  const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;
  const x = d3.scaleBand().domain(DATA.map(d => d.k)).range([0, iW]).padding(0.3);
  const y = d3.scaleLinear().domain([0, 1500]).range([iH, 0]);
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.selectAll('line.gy').data(vTicks.filter(d => d !== 0)).join('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.selectAll('rect').data(DATA).join('rect')
    .attr('x', d => x(d.k)).attr('width', x.bandwidth()).attr('y', d => y(d.v)).attr('height', d => iH - y(d.v)).attr('fill', BLUE);
  g.append('line').attr('x1', 0).attr('x2', iW).attr('y1', iH).attr('y2', iH).style('stroke', '#777777');
  axisStyle(g.append('g').call(d3.axisLeft(y).tickValues(vTicks).tickSize(0).tickPadding(6).tickFormat(fmt)));

  // 도구 기본값처럼 이름을 45도 돌림
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickSize(0).tickPadding(6))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#363636').style('font-family', FONT)
    .attr('text-anchor', 'end').attr('dx', '-0.2em').attr('dy', '0.5em').attr('transform', 'rotate(-45)');
}

function horizontal(sel) {
  const margin = { top: 6, right: 8, bottom: 24, left: 152 };
  const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;
  const y = d3.scaleBand().domain(DATA.map(d => d.k)).range([0, iH]).padding(0.3);
  const x = d3.scaleLinear().domain([0, 1250]).range([0, iW]);
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.selectAll('line.gx').data([500, 1000]).join('line')
    .attr('x1', d => x(d)).attr('x2', d => x(d)).attr('y1', 0).attr('y2', iH)
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.selectAll('rect').data(DATA).join('rect')
    .attr('x', 0).attr('y', d => y(d.k)).attr('height', y.bandwidth()).attr('width', d => x(d.v)).attr('fill', BLUE);
  g.append('line').attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', iH).style('stroke', '#777777');
  axisStyle(g.append('g').call(d3.axisLeft(y).tickSize(0).tickPadding(8)), '#363636');
  axisStyle(g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues([0, 500, 1000]).tickSize(0).tickPadding(8)
      .tickFormat(d => d === 1000 ? '1,000명' : d)));
}
vertical('#rot');
horizontal('#hor');
</script>
</body>
</html>
