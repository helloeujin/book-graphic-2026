<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-1 독자가 아는 말로 간결하게</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .block + .block { margin-top: 32px; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid #ddd; }

  /* Don't | 화살표 | Do */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); column-gap: 12px; align-items: center; }
  .label { font-size: 12px; font-weight: 700; padding: 6px 0 2px; }
  .worse { color: #b8351b; }
  .better { color: #37760a; }
  .t { font-size: 15px; line-height: 21px; font-weight: 700; padding: 8px 0; }
  .before { color: #999999; }
  .after { color: #1a1a1a; }
  .arrow { color: #bbbbbb; font-size: 15px; text-align: center; }
  .add { color: #0b66d6; }
</style>
</head>
<body>
<div class="container">

  <div class="block">
    <div class="panel-header">독자가 아는 말로 바꾸기</div>
    <div class="grid">
      <span class="label worse">Don’t</span><span></span><span class="label better">Do</span>
      <span class="t before">YoY GDP Growth Rate</span><span class="arrow">→</span>
      <span class="t after"><span class="add">전년 대비</span> 경제성장률</span>
      <span class="t before">MAU</span><span class="arrow">→</span>
      <span class="t after">월간 활성 사용자 수</span>
    </div>
  </div>

  <div class="block">
    <div class="panel-header">긴 표현 줄이기</div>
    <div class="grid">
      <span class="label worse">Don’t</span><span></span><span class="label better">Do</span>
      <span class="t before">2010년부터 2025년까지의 기간 동안 서울시의 인구가 변화한 추이</span><span class="arrow">→</span>
      <span class="t after">2010~2025년 서울 인구 변화</span>
    </div>
  </div>

</div>
</body>
</html>
