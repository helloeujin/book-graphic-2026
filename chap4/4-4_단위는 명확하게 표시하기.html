<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-4 단위는 명확하게 표시하기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .chart-title { font-size: 15px; line-height: 21px; font-weight: 700; color: #1a1a1a; }
  .chart-sub { font-size: 12px; line-height: 16px; color: #777777; margin-top: 2px; margin-bottom: 8px; }
  .sub { margin-bottom: 14px; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>섭씨인지 화씨인지 알 수 없음</span></div>
      <div class="sub" id="raw">
        <p class="chart-title">2025년 여름, 서울의 하루 최저기온</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>맨 위 눈금에 단위 표시</span></div>
      <div class="sub" id="man">
        <p class="chart-title">2025년 여름, 서울의 하루 최저기온</p>
      </div>
    </div>
  </div>
  <p class="source">서울(108) 일 최저기온, 2025년 7월 1일~8월 31일(62일). 출처: 기상청 기상자료개방포털. 두 차트는 같은 데이터와 디자인을 사용하고, 단위 표시 여부만 다릅니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
// 강조색은 tokens.json 파랑
const BLUE = '#0b66d6';
const comma = d3.format(',');

// 기상청 ASOS 서울(108) 2025년 7월 1일~8월 31일 일 최저기온(°C), 62일. 4-2 예시와 같은 데이터
const TEMPS = [26.2, 26.8, 26.5, 25.7, 26.0, 26.3, 26.7, 26.9, 27.4, 27.3, 24.6, 24.4, 25.6, 21.7, 21.5, 22.2,
  22.0, 22.9, 21.9, 25.0, 25.6, 26.6, 25.5, 25.8, 25.6, 27.6, 28.3, 28.8, 27.6, 28.3, 29.3,
  27.8, 27.3, 24.0, 23.7, 25.4, 25.8, 25.4, 23.9, 23.1, 21.0, 25.0, 23.3, 22.0, 24.2, 24.4,
  25.5, 26.1, 27.0, 26.9, 26.9, 27.4, 26.1, 27.4, 26.9, 26.3, 25.5, 23.6, 24.7, 27.3, 25.8, 25.1];
const DATA = TEMPS.map((v, i) => ({ i, v }));   // i: 0 = 7월 1일, 31 = 8월 1일, 61 = 8월 31일

// 두 차트의 선 영역 크기를 같게 맞추고, 눈금 글자 길이만큼 왼쪽 여백만 다르게 둠
const iW = 218, iH = 130, M = { top: 16, right: 8, bottom: 24 };
const x = d3.scaleLinear().domain([0, 61]).range([0, iW]);
const y = d3.scaleLinear().domain([20, 30]).range([iH, 0]);
const yTicks = [20, 25, 30];
const line = d3.line().x(d => x(d.i)).y(d => y(d.v));
const xTicks = [{ i: 0, t: '7월 1일' }, { i: 31, t: '8월 1일' }, { i: 61, t: '8월 31일' }];

function drawLine(sel, fmt, left) {
  const svg = d3.select(sel).append('svg').attr('width', left + iW + M.right).attr('height', M.top + iH + M.bottom);
  const g = svg.append('g').attr('transform', `translate(${left},${M.top})`);
  g.selectAll('line.gy').data(yTicks.filter(d => d !== 20)).join('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.append('g').call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(8).tickFormat(fmt))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  g.append('line').attr('x1', 0).attr('x2', iW).attr('y1', iH).attr('y2', iH)
    .style('stroke', '#777777').style('stroke-width', 1);
  g.append('path').datum(DATA).attr('d', line)
    .attr('fill', 'none').attr('stroke', BLUE).attr('stroke-width', 2).attr('stroke-linejoin', 'round');
  g.selectAll('text.xt').data(xTicks).join('text')
    .attr('x', d => x(d.i)).attr('y', iH + 18)
    // 양 끝 눈금이 잘리지 않도록 첫 날은 왼쪽, 마지막 날은 오른쪽 정렬
    .attr('text-anchor', (d, k) => k === 0 ? 'start' : k === xTicks.length - 1 ? 'end' : 'middle')
    .style('font-size', '13px').style('fill', '#999999').style('font-family', FONT).text(d => d.t);
}
// Don't: 숫자만 있고 단위가 어디에도 없음
drawLine('#raw', d => String(d), 30);
// Do: 맨 위 눈금에만 단위를 붙임
drawLine('#man', d => d === 30 ? '30°C' : String(d), 46);
</script>
</body>
</html>
