<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-2 서울 여름 최저기온 분포</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .chart-title { font-size: 15px; line-height: 21px; font-weight: 700; color: #1a1a1a; }
  .chart-sub { font-size: 12px; line-height: 16px; color: #777777; margin-top: 2px; margin-bottom: 8px; }
  .sub { margin-bottom: 14px; }
  .chart-note { font-size: 12px; line-height: 17px; color: #363636; margin-top: 6px; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>설명을 차트 아래에 따로 둠</span></div>
      <div class="sub" id="before">
        <p class="chart-title">2025년 여름, 서울의 하루 최저기온</p>
        <p class="chart-sub">7~8월, 최저기온별 날의 수</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>설명을 데이터 가까이 둠</span></div>
      <div class="sub" id="after">
        <p class="chart-title">2025년 여름, 서울의 하루 최저기온</p>
        <p class="chart-sub">7~8월, 최저기온별 날의 수</p>
      </div>
    </div>
  </div>
  <p class="source">서울(108) 일 최저기온, 2025년 7월 1일~8월 31일(62일). 출처: 기상청 기상자료개방포털. 면적이 높을수록 그 기온인 날이 많았다는 뜻입니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 180;
const margin = { top: 14, right: 8, bottom: 26, left: 8 };
const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;
// Before는 전체 회색, After는 25°C 이상만 붉은 계열로 강조
const BLUE = '#0b66d6', GRAY = '#d9d9d9', RED = '#e06c5a';

// 기상청 ASOS 서울(108) 2025년 7월 1일~8월 31일 일 최저기온(°C), 62일
const TEMPS = [26.2, 26.8, 26.5, 25.7, 26.0, 26.3, 26.7, 26.9, 27.4, 27.3, 24.6, 24.4, 25.6, 21.7, 21.5, 22.2,
  22.0, 22.9, 21.9, 25.0, 25.6, 26.6, 25.5, 25.8, 25.6, 27.6, 28.3, 28.8, 27.6, 28.3, 29.3,
  27.8, 27.3, 24.0, 23.7, 25.4, 25.8, 25.4, 23.9, 23.1, 21.0, 25.0, 23.3, 22.0, 24.2, 24.4,
  25.5, 26.1, 27.0, 26.9, 26.9, 27.4, 26.1, 27.4, 26.9, 26.3, 25.5, 23.6, 24.7, 27.3, 25.8, 25.1];
const LINE = 25;
const OVER = TEMPS.filter(v => v >= LINE).length; // 43일

// 분포를 부드러운 곡선으로: 가우시안 커널 밀도 추정(대역폭 0.7°C)
const BW = 0.7;
const xs = d3.range(19, 31.01, 0.1);
const dens = xs.map(t => ({ t, d: d3.mean(TEMPS, v => Math.exp(-0.5 * ((t - v) / BW) ** 2)) / (BW * Math.sqrt(2 * Math.PI)) }));

const x = d3.scaleLinear().domain([19, 31]).range([0, iW]);
const y = d3.scaleLinear().domain([0, d3.max(dens, d => d.d) * 1.1]).range([iH, 0]);
const area = d3.area().x(d => x(d.t)).y0(iH).y1(d => y(d.d)).curve(d3.curveBasis);

function draw(sel, annotate) {
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues([20, 22, 24, 26, 28, 30]).tickSize(0).tickPadding(8)
      .tickFormat(d => d === 20 ? '20°C' : d))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);

  g.append('path').datum(dens).attr('d', area).attr('fill', GRAY);

  if (annotate) {
    // 25°C 이상 구간만 강조색
    const id = 'clip-' + sel.slice(1);
    g.append('clipPath').attr('id', id).append('rect')
      .attr('x', x(LINE)).attr('y', 0).attr('width', iW - x(LINE)).attr('height', iH);
    g.append('path').datum(dens).attr('d', area).attr('fill', RED).attr('clip-path', `url(#${id})`);
  }

  g.append('line').attr('x1', 0).attr('x2', iW).attr('y1', iH).attr('y2', iH)
    .style('stroke', '#777777').style('stroke-width', 1);

  if (!annotate) {
    // 같은 설명을 차트 아래 문장으로 따로 둠
    d3.select(sel).append('p').attr('class', 'chart-note')
      .text(`62일 중 ${OVER}일(${Math.round(OVER / TEMPS.length * 100)}%)은 최저기온이 25°C 이상이었습니다.`);
    return;
  }

  // 25°C 기준선
  g.append('line').attr('x1', x(LINE)).attr('x2', x(LINE)).attr('y1', 0).attr('y2', iH)
    .style('stroke', '#363636').style('stroke-width', 1).style('stroke-dasharray', '3,3');
  g.append('text').attr('x', x(LINE) - 6).attr('y', 10).attr('text-anchor', 'end')
    .style('font-size', '12px').style('fill', '#888888').style('font-family', FONT).text('25°C');

  // 읽는 방법 안내
  const r = g.append('text').attr('x', 0).attr('y', y(y.domain()[1] * 0.55))
    .style('font-size', '12px').style('fill', '#888888').style('font-family', FONT);
  r.append('tspan').attr('x', 0).text('↑');
  r.append('tspan').attr('x', 0).attr('dy', 15).text('더 자주');

  // 기준 이상 구간의 의미를 비율로
  const tx = iW;
  const t = g.append('text').attr('x', tx).attr('y', 10).attr('text-anchor', 'end')
    .style('font-size', '12px').style('fill', '#363636').style('font-family', FONT);
  t.append('tspan').attr('x', tx).style('font-weight', 700).text(`${OVER}일 (${Math.round(OVER / TEMPS.length * 100)}%)`);
  t.append('tspan').attr('x', tx).attr('dy', 15).text('최저기온');
  t.append('tspan').attr('x', tx).attr('dy', 15).text('25°C 이상');
}
draw('#before', false);
draw('#after', true);
</script>
</body>
</html>
