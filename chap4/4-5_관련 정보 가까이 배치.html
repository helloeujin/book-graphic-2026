<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-5 관련 정보 가까이 배치</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; min-height: 33px; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .t-title, .t-sub, .t-src { display: block; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>모든 간격이 비슷함</span></div>
      <div id="even"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>관련된 정보끼리 묶음</span></div>
      <div id="hier"></div>
    </div>
  </div>
  <p class="source">두 차트는 같은 데이터와 텍스트 스타일을 사용하고, 텍스트 사이의 간격만 다릅니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";

// 가상 데이터
const DATA = [
  { region: '대구', v: 12.1 },
  { region: '광주', v: 9.4 },
  { region: '부산', v: 7.8 },
  { region: '인천', v: 5.0 },
  { region: '서울', v: 3.2 },
];
const HI = '대구';
const BLUE = '#0b66d6', GRAY = '#bbbbbb';

const TEXT = {
  title: '대구의 매출 증가율이 가장 높았다',
  sub: '2025년 지역별 매출 증가율',
  src: '출처: 가상 데이터',
};

// 텍스트 역할별 스타일 [크기, 굵기, 색]
const S = {
  flat: {
    title: [13, 400, '#555555'], sub: [13, 400, '#555555'], annot: [13, 400, '#555555'],
    axis: [13, 400, '#555555'], val: [13, 400, '#555555'], hiVal: [13, 400, '#555555'], src: [13, 400, '#555555'],
  },
  hier: {
    title: [15, 700, '#1a1a1a'], sub: [13, 400, '#555555'], annot: [12, 400, '#363636'],
    axis: [13, 400, '#767676'], val: [13, 400, '#767676'], hiVal: [13, 700, '#1a1a1a'], src: [12, 400, '#767676'],
  },
};

function css(el, [size, weight, color]) {
  return el.style('font-size', size + 'px').style('font-weight', weight).style('fill', color)
           .style('color', color).style('font-family', FONT);
}

function draw(sel, st, gap) {
  const root = d3.select(sel);
  css(root.append('p').attr('class', 't-title').style('line-height', '1.4').text(TEXT.title), st.title);
  css(root.append('p').attr('class', 't-sub').style('line-height', '1.35').style('margin-top', gap.ts + 'px')
    .style('margin-bottom', gap.sc + 'px').text(TEXT.sub), st.sub);

  const W = 298, H = 134;
  const margin = { top: 4, right: 50, bottom: 2, left: 32 };
  const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;
  const x = d3.scaleLinear().domain([0, 12.1]).range([0, iW]);
  const y = d3.scaleBand().domain(DATA.map(d => d.region)).range([0, iH]).padding(0.3);

  const svg = root.append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);


  g.selectAll('rect.bar').data(DATA).join('rect')
    .attr('x', 0).attr('y', d => y(d.region))
    .attr('width', d => x(d.v)).attr('height', y.bandwidth())
    .attr('fill', d => d.region === HI ? BLUE : GRAY);

  g.append('line').attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', iH)
    .style('stroke', '#777777').style('stroke-width', 1);

  // 축 레이블(지역명)
  g.selectAll('text.axis').data(DATA).join('text')
    .attr('x', -8).attr('y', d => y(d.region) + y.bandwidth() / 2).attr('dy', '0.35em')
    .attr('text-anchor', 'end').text(d => d.region)
    .each(function () { css(d3.select(this), st.axis); });

  // 데이터 레이블
  g.selectAll('text.val').data(DATA).join('text')
    .attr('x', d => x(d.v) + 5).attr('y', d => y(d.region) + y.bandwidth() / 2).attr('dy', '0.35em')
    .style('paint-order', 'stroke').style('stroke', '#ffffff').style('stroke-width', 4)
    .text(d => d.v.toFixed(1) + (d.region === HI ? '%' : ''))
    .each(function (d) { css(d3.select(this), d.region === HI ? st.hiVal : st.val); });

  css(root.append('p').attr('class', 't-src').style('margin-top', gap.cs + 'px').text(TEXT.src), st.src);
}

draw('#even', S.hier, { ts: 16, sc: 16, cs: 16 });   // 모든 간격이 같음
draw('#hier', S.hier, { ts: 2,  sc: 10, cs: 10 });   // 제목·부제는 붙이고, 차트·출처와는 띄움

</script>
</body>
</html>
