<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-4 큰 숫자는 읽기 쉬운 단위로 줄이기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .chart-title { font-size: 15px; line-height: 21px; font-weight: 700; color: #1a1a1a; }
  .chart-sub { font-size: 12px; line-height: 16px; color: #777777; margin-top: 2px; margin-bottom: 8px; }
  .sub { margin-bottom: 14px; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>자릿수를 세어야 읽힘</span></div>
      <div class="sub" id="raw">
        <p class="chart-title">연간 이용자 수</p>
        <p class="chart-sub">단위: 명</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>만 단위로 줄임</span></div>
      <div class="sub" id="man">
        <p class="chart-title">연간 이용자 수</p>
        <p class="chart-sub">단위: 명</p>
      </div>
    </div>
  </div>
  <p class="source">가상 데이터. 두 차트는 같은 데이터와 디자인을 사용하고, 세로축 눈금의 숫자 표기만 다릅니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
// 강조할 항목이 없으므로 4-1 예시처럼 모든 막대를 tokens.json 파랑으로
const BLUE = '#0b66d6';
const comma = d3.format(',');

// 두 차트의 막대 영역 크기를 같게 맞추고, 눈금 글자 길이만큼 왼쪽 여백만 다르게 둠
const YEARS = [
  { year: 2021, v: 4920000 },
  { year: 2022, v: 6810000 },
  { year: 2023, v: 8930000 },
  { year: 2024, v: 11240000 },
  { year: 2025, v: 12847300 },
];
const vW = 218, vH = 130, vM = { top: 10, right: 4, bottom: 24 };
const vx = d3.scaleBand().domain(YEARS.map(d => d.year)).range([0, vW]).padding(0.22);
const vy = d3.scaleLinear().domain([0, 15000000]).range([vH, 0]);
const yTicks = [0, 5000000, 10000000, 15000000];

function drawColumns(sel, fmt, left) {
  const svg = d3.select(sel).append('svg').attr('width', left + vW + vM.right).attr('height', vM.top + vH + vM.bottom);
  const g = svg.append('g').attr('transform', `translate(${left},${vM.top})`);
  g.selectAll('line.gy').data(yTicks.filter(d => d !== 0)).join('line')
    .attr('x1', 0).attr('x2', vW).attr('y1', d => vy(d)).attr('y2', d => vy(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.append('g').call(d3.axisLeft(vy).tickValues(yTicks).tickSize(0).tickPadding(8).tickFormat(fmt))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  g.selectAll('rect.bar').data(YEARS).join('rect')
    .attr('x', d => vx(d.year)).attr('y', d => vy(d.v))
    .attr('width', vx.bandwidth()).attr('height', d => vH - vy(d.v))
    .attr('fill', BLUE);
  g.append('line').attr('x1', 0).attr('x2', vW).attr('y1', vH).attr('y2', vH)
    .style('stroke', '#777777').style('stroke-width', 1);
  g.append('g').attr('transform', `translate(0,${vH})`)
    .call(d3.axisBottom(vx).tickValues([2021, 2025]).tickSize(0).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
}
drawColumns('#raw', comma, 74);
drawColumns('#man', d => d === 0 ? '0' : comma(d / 1e4) + '만', 54);
</script>
</body>
</html>
