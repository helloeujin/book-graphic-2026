<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-4 필요한 만큼 정확하게 표시하기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; word-break: keep-all; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .chart-title { font-size: 15px; line-height: 21px; font-weight: 700; color: #1a1a1a; }
  .chart-sub { font-size: 12px; line-height: 16px; color: #777777; margin-top: 2px; margin-bottom: 8px; }
  .sub { margin-bottom: 14px; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Don’t</span><span>값마다 자릿수가 다름</span></div>
      <div class="sub" id="dont">
        <p class="chart-title">지역별 매출 증가율</p>
        <p class="chart-sub">단위: %</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">Do</span><span>모두 소수점 한 자리</span></div>
      <div class="sub" id="do">
        <p class="chart-title">지역별 매출 증가율</p>
        <p class="chart-sub">단위: %</p>
      </div>
    </div>
  </div>
  <p class="source">가상 데이터. 두 차트는 같은 데이터와 디자인을 사용하고, 데이터 레이블의 숫자 표기만 다릅니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 168;
const margin = { top: 4, right: 4, bottom: 4, left: 34 };
const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;

// 가상 데이터
const DATA = [
  { region: '대구', v: 12.1 },
  { region: '광주', v: 9.43 },
  { region: '부산', v: 7.84 },
  { region: '인천', v: 5.0 },
  { region: '서울', v: 3.215 },
];
// 강조할 항목이 없으므로 4-1 예시처럼 모든 막대를 tokens.json 파랑으로
const BLUE = '#0b66d6';

const x = d3.scaleLinear().domain([0, 15]).range([0, iW]);
const y = d3.scaleBand().domain(DATA.map(d => d.region)).range([0, iH]).padding(0.3);
const xTicks = [0, 2.5, 5, 7.5, 10, 12.5];

// Don't: 레이블 자릿수가 제각각이고, 눈금도 정수와 소수가 섞여 있음
const dontLabel = d => ({ 12.1: '12.1', 9.43: '9.43', 7.84: '7.84', 5: '5', 3.215: '3.215' })[d] + '%';
const dontTick = d => String(d);
// Do: 레이블과 눈금 모두 소수점 한 자리
const doLabel = d => d.toFixed(1) + '%';
const doTick = d => d.toFixed(1);

function draw(sel, labelFmt, tickFmt) {
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  g.append('g').call(d3.axisLeft(y).tickSize(0).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  g.selectAll('rect.bar').data(DATA).join('rect')
    .attr('x', 0).attr('y', d => y(d.region))
    .attr('width', d => x(d.v)).attr('height', y.bandwidth())
    .attr('fill', BLUE);
  g.append('line').attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', iH)
    .style('stroke', '#777777').style('stroke-width', 1);
  g.selectAll('text.val').data(DATA).join('text')
    .attr('x', d => x(d.v) + 5).attr('y', d => y(d.region) + y.bandwidth() / 2).attr('dy', '0.35em')
    .style('font-size', '13px').style('font-weight', 700).style('fill', '#363636').style('font-family', FONT)
    .style('paint-order', 'stroke').style('stroke', '#ffffff').style('stroke-width', 4)
    .text(d => labelFmt(d.v));
}
draw('#dont', dontLabel, dontTick);
draw('#do', doLabel, doTick);
</script>
</body>
</html>
