<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-4 흑백으로 확인하기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .cond { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .cond-name { font-size: 13px; color: #363636; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 13px; color: #363636; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sub { margin-bottom: 14px; }
  .gray svg, .gray .legend-item i { filter: grayscale(100%); }
  .result { font-size: 13px; line-height: 17px; font-weight: 400; color: #363636; margin-top: 2px; }
  .result strong { font-weight: 700; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Before</span><span>명도가 비슷한 파랑과 주황</span></div>
      <div class="sub" id="before-color"></div>
      <div class="sub gray" id="before-gray"></div>
      <p class="result"><strong>결과:</strong> 컬러에서는 뚜렷하게 다르지만, 흑백에서는 두 막대가 비슷한 회색이 되어 어느 쪽이 서울인지 알기 어렵습니다.</p>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">After</span><span>명도 차이가 큰 진한 파랑과 연한 주황</span></div>
      <div class="sub" id="after-color"></div>
      <div class="sub gray" id="after-gray"></div>
      <p class="result"><strong>결과:</strong> 흑백에서도 진한 막대와 연한 막대로 두 도시가 바로 구분됩니다.</p>
    </div>
  </div>
  <p class="source">서울과 부산의 2025년 월평균 기온(°C). 출처: 기상청 기상자료개방포털(종관기상관측 일평균기온을 월별로 평균). 흑백 차트는 같은 차트에 회색조 필터를 적용한 모습입니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 150;
const margin = { top: 8, right: 8, bottom: 24, left: 40 };
const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;

// 기상청 ASOS 일평균기온(서울 108, 부산 159)을 월별로 평균한 값, 2025년
const MONTHS = ['1월', '4월', '7월', '10월'];
const DATA = { '서울': [-0.4, 13.4, 28.8, 16.5], '부산': [4.0, 14.0, 27.8, 19.6] };
const CITIES = ['서울', '부산'];

// Before: tokens.json 파랑·주황 (L* 약 45, 52로 명도가 비슷)
// After: 진한 파랑·연한 주황 (L* 약 28, 73으로 명도 차이가 큼)
const PALETTE = {
  before: { '서울': '#0b66d6', '부산': '#c95c03' },
  after:  { '서울': '#0a3f86', '부산': '#f0a35e' }
};

const x0 = d3.scaleBand().domain(MONTHS).range([0, iW]).padding(0.25);
const x1 = d3.scaleBand().domain(CITIES).range([0, x0.bandwidth()]).padding(0.08);
const y = d3.scaleLinear().domain([-3, 30]).range([iH, 0]);
const yTicks = [0, 15, 30];

function draw(sel, C, name) {
  const h = d3.select(sel).append('div').attr('class', 'cond');
  h.append('span').attr('class', 'cond-name').text(name);
  CITIES.forEach(c => {
    const it = h.append('span').attr('class', 'legend-item');
    it.append('i').style('background', C[c]);
    it.node().append(c);
  });
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  g.selectAll('line.gy').data(yTicks).join('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.append('g').call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(8)
      .tickFormat(d => d === 30 ? '30°C' : d))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  MONTHS.forEach((m, i) => {
    CITIES.forEach(c => {
      const v = DATA[c][i];
      g.append('rect').attr('x', x0(m) + x1(c)).attr('width', x1.bandwidth())
        .attr('y', y(Math.max(0, v))).attr('height', Math.abs(y(v) - y(0)))
        .attr('fill', C[c]);
    });
  });
  // zero line: 막대 이후에 그림
  g.append('line').attr('x1', 0).attr('x2', iW).attr('y1', y(0)).attr('y2', y(0))
    .style('stroke', '#363636').style('stroke-opacity', 0.4);
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x0).tickSize(0).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
}
['before', 'after'].forEach(k => {
  draw('#' + k + '-color', PALETTE[k], '컬러');
  draw('#' + k + '-gray', PALETTE[k], '흑백');
});
</script>
</body>
</html>

</body></html>
