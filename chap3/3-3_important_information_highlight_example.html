<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중요한 정보 강조하기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #fff; }
  }
  :root[data-theme="dark"] { --bg: #fff; }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    padding: 40px 20px;
  }

  .container {
    max-width: 620px;
    margin: 0;
  }

  .compare-wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .panel {
    flex: 1 1 236px;
  }

  .panel-header {
    font-size: 13px;
    font-weight: 500;
    color: #363636;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid #ddd;
  }

  .badge {
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 3px 10px;
    color: #fff;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .badge-worse { background: #b8351b; }
  .badge-better { background: #37760a; }

  .result {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #363636;
    margin-top: 6px;
  }

  .result strong { font-weight: 700; }

  .source {
    font-size: 13px;
    line-height: 17px;
    color: #777;
    margin-top: 18px;
  }
</style>
</head>

<body>
<div class="container">
  <div class="compare-wrap">

    <div class="panel">
      <div class="panel-header">
        <span class="badge badge-worse">Worse</span>
        <span>모든 지역을 서로 다른 색으로</span>
      </div>
      <div id="chart-worse"></div>
      <p class="result"><strong>결과:</strong> 모든 막대가 서로 다른 색이라 서울이 다른 지역보다 먼저 눈에 띄지 않습니다.</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="badge badge-better">Better</span>
        <span>서울만 강조색으로</span>
      </div>
      <div id="chart-better"></div>
      <p class="result"><strong>결과:</strong> 다른 지역은 맥락으로 남아 있으면서 서울이 바로 눈에 들어옵니다.</p>
    </div>

  </div>

  <p class="source">지역별 매출, 예시 데이터</p>
</div>

<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 205;
const margin = { top: 10, right: 8, bottom: 32, left: 38 };
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;

const DATA = [
  { k: '서울', v: 82 },
  { k: '부산', v: 58 },
  { k: '인천', v: 64 },
  { k: '대구', v: 47 },
  { k: '대전', v: 53 }
];

// 기존 3-1 예시에서 사용한 tokens.json 계열 색상
const CATEGORY = ['#cc2b0c', '#0b66d6', '#824cd5', '#3b8601', '#eaba04'];
const HIGHLIGHT = '#cc2b0c';
const NEUTRAL = '#c7c7c7';

const x = d3.scaleBand()
  .domain(DATA.map(d => d.k))
  .range([0, iW])
  .padding(0.32);

const y = d3.scaleLinear()
  .domain([0, 100])
  .range([iH, 0]);

const yTicks = [0, 50, 100];

function drawPanel(key) {
  const svg = d3.select('#chart-' + key)
    .append('svg')
    .attr('width', W)
    .attr('height', H);

  const g = svg.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  // grid
  g.selectAll('line.grid')
    .data(yTicks.filter(d => d !== 0))
    .join('line')
    .attr('x1', 0)
    .attr('x2', iW)
    .attr('y1', d => y(d))
    .attr('y2', d => y(d))
    .style('stroke', '#aaaaaa')
    .style('stroke-dasharray', '2')
    .style('stroke-opacity', 0.4);

  // bars
  g.selectAll('rect')
    .data(DATA)
    .join('rect')
    .attr('x', d => x(d.k))
    .attr('width', x.bandwidth())
    .attr('y', d => y(d.v))
    .attr('height', d => y(0) - y(d.v))
    .attr('fill', (d, i) => {
      if (key === 'worse') return CATEGORY[i];
      return d.k === '서울' ? HIGHLIGHT : NEUTRAL;
    });

  // zero line
  g.append('line')
    .attr('x1', 0)
    .attr('x2', iW)
    .attr('y1', y(0))
    .attr('y2', y(0))
    .style('stroke', '#363636')
    .style('stroke-opacity', 0.4);

  // y axis
  g.append('g')
    .call(
      d3.axisLeft(y)
        .tickValues(yTicks)
        .tickSize(0)
        .tickPadding(8)
        .tickFormat(d => d === 100 ? '100' : d)
    )
    .call(a => a.select('.domain').remove())
    .selectAll('text')
    .style('font-size', '13px')
    .style('fill', '#999999')
    .style('font-family', FONT);

  // 지역 이름을 두 패널 모두 막대 아래에 직접 표시
  const labels = DATA.map(d => d.k);

  g.selectAll('text.x-label')
    .data(DATA)
    .join('text')
    .attr('class', 'x-label')
    .attr('x', d => x(d.k) + x.bandwidth() / 2)
    .attr('y', iH + 21)
    .attr('text-anchor', 'middle')
    .style('font-size', '13px')
    .style('font-family', FONT)
    .style('font-weight', d => key === 'better' && d.k === '서울' ? 700 : 400)
    .style('fill', d => key === 'better' && d.k === '서울' ? '#363636' : '#999999')
    .text((d, i) => labels[i]);
}

drawPanel('worse');
drawPanel('better');
</script>
</body>
</html>
