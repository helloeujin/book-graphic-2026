<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-4 WCAG 대비 기준</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 620px; margin: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) 64px minmax(0, 1.3fr) 76px 76px; column-gap: 12px; row-gap: 10px; align-items: center; }
  .bar { height: 18px; border-radius: 0; }
  .num { font-size: 13px; color: #363636; font-variant-numeric: tabular-nums; }
  .txt { font-size: 13px; }
  .ok, .ng { font-size: 13px; text-align: center; }
  .ok { color: #37760a; font-weight: 700; }
  .ng { color: #b8351b; }
  .col-head { font-size: 13px; color: #363636; text-align: center; }
  .row-head { font-size: 13px; color: #363636; }
  .pair { display: flex; height: 34px; }
  .pair i { flex: 1; display: block; }
  .result { font-size: 13px; line-height: 17px; font-weight: 400; color: #363636; margin-top: 14px; }
  .result strong { font-weight: 700; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="panel-header"><span>흰 배경 위에서 색별 대비와 WCAG 최소 기준</span></div>
  <div class="grid" id="grid"></div>
  <p class="result"><strong>결과:</strong> 연한 노랑과 밝은 회색은 막대로 써도 3:1에 미치지 못합니다. 주황과 회색(#8a8a8a)은 그래픽 기준(3:1)은 넘지만, 작은 텍스트 기준(4.5:1)에는 미치지 못합니다.</p>
  <p class="source">대비는 WCAG의 상대 휘도 공식으로 계산했습니다. 1:1(차이 없음)부터 21:1(흰색과 검정)까지의 값을 가집니다. 그래픽 기준은 1.4.11, 텍스트 기준은 1.4.3(일반 크기)입니다.</p>
</div>
<script>
// tokens.json 색과 앞 예시에서 쓴 색
const COLORS = [
  { k: '연한 노랑', c: '#f2e9b8' },
  { k: '밝은 회색', c: '#bbbbbb' },
  { k: '회색',      c: '#8a8a8a' },
  { k: '주황',      c: '#c95c03' },
  { k: '파랑',      c: '#0b66d6' },
  { k: '진한 회색', c: '#363636' }
];
// WCAG 상대 휘도와 대비율
const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const lum = h => { const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => m - n); return (y + 0.05) / (x + 0.05); };

const grid = document.getElementById('grid');
const cell = (cls, text) => { const d = document.createElement('div'); d.className = cls; if (text !== undefined) d.textContent = text; grid.appendChild(d); return d; };
['그래픽 견본', '대비', '텍스트 견본', '그래픽 3:1', '텍스트 4.5:1'].forEach((t, i) =>
  cell('col-head', t).style.textAlign = i === 0 || i === 2 ? 'left' : 'center');
COLORS.forEach(({ k, c }) => {
  cell('bar').style.background = c;
  const r = ratio(c, '#ffffff');
  cell('num', r.toFixed(2) + ':1').style.textAlign = 'center';
  const t = cell('txt', k + ' 텍스트 123'); t.style.color = c;
  const g = cell(r >= 3 ? 'ok' : 'ng', r >= 3 ? '충족' : '미달');
  const tx = cell(r >= 4.5 ? 'ok' : 'ng', r >= 4.5 ? '충족' : '미달');
});
</script>
</body>
</html>

</body></html>
