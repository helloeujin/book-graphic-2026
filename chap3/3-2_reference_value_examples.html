<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기준값의 예</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;padding:40px 20px;font-family:Pretendard,"Noto Sans KR",sans-serif;color:#363636;background:#fff}.wrap{max-width:620px}.row{display:grid;grid-template-columns:112px 1fr;gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid #e3e3e3}.row:first-child{padding-top:0}.row:last-child{border-bottom:0}.label{font-size:13px;font-weight:700;line-height:17px}.sub{display:block;margin-top:3px;font-size:12px;font-weight:400;line-height:16px;color:#777}.words{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:6px;font-size:12px;color:#636363}.words span:nth-child(2){font-weight:700;color:#363636;text-align:center}.words span:last-child{text-align:right}.bar{position:relative;display:grid;grid-template-columns:repeat(9,1fr);height:14px}.bar i{display:block}.bar i:first-child{border-radius:2px 0 0 2px}.bar i:nth-child(9){border-radius:0 2px 2px 0}.bar:after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:20px;background:#363636}.note{margin-top:18px;font-size:13px;line-height:17px;color:#777}
</style></head><body><div class="wrap"><div id="rows"></div><p class="note">기준값을 중심으로 양쪽의 값이 서로 다른 의미나 방향을 가질 때 발산형 팔레트를 고려할 수 있습니다.</p></div>
<script>
const rows=[
["0","예: 흑자와 적자","감소","0","증가"],
["목표값","","미달","목표","달성"],
["중립값","예: 반대와 찬성","불만족","중립","만족"],
["평균·중앙값","분석적으로 의미 있을 때","낮음","평균","높음"]
];
const colors=["#1D5F9A","#4D82B1","#79A9D1","#B7D0E5","#EAEAEA","#F1C9BE","#E89A86","#D5654B","#B8351B"];
document.querySelector("#rows").innerHTML=rows.map(r=>`<div class="row"><div class="label">${r[0]}${r[1]?`<span class="sub">${r[1]}</span>`:""}</div><div><div class="words"><span>${r[2]}</span><span>${r[3]}</span><span>${r[4]}</span></div><div class="bar">${colors.map(c=>`<i style="background:${c}"></i>`).join("")}</div></div></div>`).join("");
</script></body></html>
