    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  // 단위: y축 레이블 위
  g.append('text').attr('x', -margin.left).attr('y', y(yTicks[yTicks.length - 1]) - 14)
    .style('font-size', '13px').style('fill', '#999999').style('font-family', FONT).text('백만 ㎢');
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues(MONTH.map(m => m.d)).tickFormat((d, i) => MONTH[i].t).tickSize(4).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .call(a => a.selectAll('.tick line').style('stroke', '#aaaaaa'))
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  return g;
}

// 1. 해마다 다른 색
{
  const g = base('#chart-all');
  YEARS.forEach((yr, i) => g.append('path').datum(DATA[yr]).attr('d', line)
    .attr('fill', 'none').attr('stroke', LOUD[i % LOUD.length]).attr('stroke-width', 1).attr('stroke-opacity', 0.85));
}
// 2. 시간 순서는 명도로, 2012년만 강조
{
  const g = base('#chart-focus');
  YEARS.filter(yr => yr !== FOCUS).forEach(yr => g.append('path').datum(DATA[yr]).attr('d', line)
    .attr('fill', 'none').attr('stroke', seq(yr)).attr('stroke-width', 1));
  g.append('path').datum(DATA[FOCUS]).attr('d', line)
    .attr('fill', 'none').attr('stroke', '#000000').attr('stroke-width', 2.6);
  // 2025년 최저점 표시
  const v = DATA[FOCUS], k = d3.minIndex(v.map(d => d ?? 99));
  const px = x(DOYS[k]), py = y(v[k]);
  g.append('circle').attr('cx', px).attr('cy', py).attr('r', 3).attr('fill', '#000000');
  g.append('text').attr('x', px).attr('y', py + 27).attr('text-anchor', 'middle')
    .style('font-size', '14px').style('font-weight', 700).style('font-family', FONT).style('fill', '#000000')
    .style('paint-order', 'stroke').style('stroke', '#ffffff').style('stroke-width', 3).style('stroke-linejoin', 'round')
    .text('2025년');
}
