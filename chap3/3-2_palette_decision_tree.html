<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어떤 팔레트를 선택할까?</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 20px;
  background: #fff;
  color: #363636;
  font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; }
.flow { max-width: 650px; margin: 0 auto; }

.question {
  text-align: center;
  font-size: 14px;
  line-height: 1.55;
  font-weight: 600;
  padding: 13px 18px;
  border: 1px solid #c6c6c6;
  border-radius: 4px;
  background: #fff;
}
.step-label {
  display: inline-block;
  margin-right: 7px;
  color: #777;
  font-size: 12px;
  font-weight: 700;
}
.down {
  height: 28px;
  width: 1px;
  background: #a4a4a4;
  margin: 0 auto;
  position: relative;
}
.down::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: -3px;
  width: 6px;
  height: 6px;
  border-right: 1px solid #a4a4a4;
  border-bottom: 1px solid #a4a4a4;
  transform: rotate(45deg);
}
.branch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  position: relative;
  padding-top: 28px;
}
.branch::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  border-top: 1px solid #a4a4a4;
}
.branch::after {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 1px;
  width: 1px;
}
.option {
  position: relative;
  text-align: center;
}
.option::before {
  content: "";
  position: absolute;
  top: -28px;
  left: 50%;
  height: 28px;
  border-left: 1px solid #a4a4a4;
}
.option::after {
  content: "";
  position: absolute;
  top: -7px;
  left: calc(50% - 3px);
  width: 6px;
  height: 6px;
  border-right: 1px solid #a4a4a4;
  border-bottom: 1px solid #a4a4a4;
  transform: rotate(45deg);
}
.answer {
  font-size: 12px;
  font-weight: 600;
  color: #777;
  margin-bottom: 7px;
}
.result {
  min-height: 78px;
  border-top: 3px solid #636363;
  padding: 12px 10px 10px;
  background: #f7f7f7;
}
.result-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 7px;
}
.result-desc {
  font-size: 12px;
  line-height: 1.5;
  color: #636363;
}
.scale {
  height: 8px;
  margin: 10px auto 0;
  max-width: 150px;
}
.sequential {
  background: linear-gradient(90deg, #e9f2fc, #8dbbe9, #0b66d6);
}
.diverging {
  background: linear-gradient(90deg, #0b66d6, #eaeaea 50%, #cc2b0c);
}
.section-gap {
  height: 38px;
  position: relative;
}
.section-gap::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8px;
  bottom: 5px;
  border-left: 1px dashed #c6c6c6;
}
.section-gap::after {
  content: "";
  position: absolute;
  bottom: 3px;
  left: calc(50% - 3px);
  width: 6px;
  height: 6px;
  border-right: 1px solid #a4a4a4;
  border-bottom: 1px solid #a4a4a4;
  transform: rotate(45deg);
}
.check {
  text-align: left;
  margin-top: 28px;
  padding: 15px 18px;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
}
.check-title {
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
  margin-bottom: 7px;
}
.check-text {
  font-size: 12px;
  line-height: 1.65;
  color: #636363;
}
.mini-strip {
  margin-top: 12px;
  height: 9px;
  background: linear-gradient(90deg, #f4e9a3, #b8dca8, #62c1ad, #328fa8, #24577a);
}
@media (max-width: 560px) {
  .branch { gap: 12px; }
  .result { min-height: 94px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="flow">

    <div class="question">
      <span class="step-label">1</span>
      의미 있는 기준값을 중심으로 양쪽의 차이를 보여주는 것이 중요한가?
    </div>

    <div class="branch">
      <div class="option">
        <div class="answer">아니오</div>
        <div class="result">
          <div class="result-title">순차형 팔레트</div>
          <div class="result-desc">낮음 → 높음</div>
          <div class="scale sequential"></div>
        </div>
      </div>
      <div class="option">
        <div class="answer">예</div>
        <div class="result">
          <div class="result-title">발산형 팔레트</div>
          <div class="result-desc">한 방향 ← 기준값 → 다른 방향</div>
          <div class="scale diverging"></div>
        </div>
      </div>
    </div>

    <div class="section-gap"></div>

    <div class="question">
      <span class="step-label">2</span>
      값을 어떻게 보여줄 것인가?
    </div>

    <div class="branch">
      <div class="option">
        <div class="answer">연속적인 변화</div>
        <div class="result">
          <div class="result-title">연속형</div>
          <div class="result-desc">값의 변화를 끊김 없이 표현</div>
          <div class="scale sequential"></div>
        </div>
      </div>
      <div class="option">
        <div class="answer">의미 있는 범위</div>
        <div class="result">
          <div class="result-title">구간형</div>
          <div class="result-desc">값을 몇 개의 범위로 나누어 표현</div>
          <div class="scale" style="background:linear-gradient(90deg,#e9f2fc 0 25%,#b7d4f2 25% 50%,#659edb 50% 75%,#0b66d6 75% 100%)"></div>
        </div>
      </div>
    </div>

    <div class="section-gap"></div>

    <div class="check">
      <div class="check-title">
        <span class="step-label">3</span>
        색의 변화가 데이터의 변화처럼 보이는가?
      </div>
      <div class="check-text">
        긴 색 띠로 만들어 특정 지점에서 갑자기 변해 보이지 않는지 확인합니다.
        필요하다면 회색조로 바꿔 명도의 흐름도 살펴봅니다.
      </div>
      <div class="mini-strip"></div>
    </div>

  </div>
</div>
</body>
</html>
