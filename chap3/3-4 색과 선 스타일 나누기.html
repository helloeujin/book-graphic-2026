<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-4 색과 선 스타일 나누기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .cond { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .cond-name { font-size: 13px; color: #363636; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 13px; color: #363636; }
  .legend-item svg { display: inline-block; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sub { margin-bottom: 14px; }
  .result { font-size: 13px; line-height: 17px; font-weight: 400; color: #363636; margin-top: 2px; }
  .result strong { font-weight: 700; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Before</span><span>네 가지 색으로 선 구분</span></div>
      <div class="sub" id="before-normal"></div>
      <p class="result"><strong>결과:</strong> 네 가지 색을 범례와 하나씩 맞춰봐야 어떤 선이 어떤 데이터인지 알 수 있습니다. 빨강과 주황처럼 비슷한 색은 더 헷갈립니다.</p>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">After</span><span>색과 선 스타일을 나눠 사용</span></div>
      <div class="sub" id="after-normal"></div>
      <p class="result"><strong>결과:</strong> 색은 도시를, 선 스타일은 연도를 나타내 두 가지 색만으로 네 개의 선을 구분할 수 있습니다.</p>
    </div>
  </div>
  <p class="source">서울과 부산의 12월 기온(°C, 일평균기온의 7일 이동평균), 2024년과 2025년. 출처: 기상청 기상자료개방포털(종관기상관측)</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";

const W = 298, H = 170;
const margin = { top: 10, right: 0, bottom: 24, left: 40 };
const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;
const LABEL_W = 40;  // After 패널의 선 끝 레이블 공간

// 기상청 종관기상관측(ASOS) 일평균기온(서울 108, 부산 159)
// 12월 각 날짜까지의 7일 이동평균(°C). 1~6일은 11월 말 값을 포함해 계산
const months = d3.range(1, 32);
const SERIES = [
  { k: '서울 2025년', city: '서울', period: 'now',  v: [6.4, 5.4, 3.6, 2.4, 1.7, 1.2, 0.6, 0.3, 0.7, 2.2, 3.3, 3.9, 4.0, 2.8, 2.4, 2.6, 2.5, 2.2, 2.6, 3.3, 3.2, 3.0, 2.8, 2.6, 1.7, -0.1, -1.5, -0.9, -0.1, -0.6, -1.8] },
  { k: '서울 2024년', city: '서울', period: 'norm', v: [3.5, 2.9, 2.3, 2.8, 3.2, 3.5, 3.2, 2.4, 1.6, 1.8, 1.8, 1.3, 1.2, 1.0, 1.2, 1.0, 0.6, -0.4, -0.6, -0.6, -0.6, -1.2, -1.1, -1.1, -0.2, 0.0, -0.6, -0.9, -0.3, 0.5, 0.6] },
  { k: '부산 2025년', city: '부산', period: 'now',  v: [11.4, 10.9, 9.8, 8.6, 8.0, 7.3, 6.6, 6.0, 5.7, 6.6, 7.9, 8.5, 8.8, 7.8, 7.3, 7.6, 7.7, 7.3, 8.1, 9.2, 9.3, 9.5, 9.7, 9.7, 8.9, 6.6, 4.6, 4.7, 5.2, 4.6, 3.5] },
  { k: '부산 2024년', city: '부산', period: 'norm', v: [9.3, 9.4, 9.1, 9.1, 9.2, 9.4, 8.9, 7.9, 6.6, 6.2, 6.3, 6.1, 5.6, 5.4, 5.5, 5.5, 5.3, 4.6, 4.2, 4.5, 4.6, 4.1, 4.0, 3.9, 4.5, 4.9, 4.3, 3.9, 4.3, 4.8, 5.1] }
];

// Before: 네 개의 선에 각각 다른 색 (tokens.json base + 청록)
const BEFORE = { '서울 2025년': '#824cd5', '서울 2024년': '#cc2b0c', '부산 2025년': '#14897d', '부산 2024년': '#c95c03' };
// After: 도시에만 색, 기간은 선 스타일
const AFTER = { '서울': '#824cd5', '부산': '#14897d' };
const DASH = '1 4';

const y = d3.scaleLinear().domain([-3, 12]).range([iH, 0]);
const yTicks = [0, 5, 10];

function legendRow(sel, items) {
  const h = d3.select(sel).append('div').attr('class', 'cond');
  items.forEach(it => {
    const span = h.append('span').attr('class', 'legend-item');
    if (it.dot) span.append('i').style('background', it.color);
    else {
      const sv = span.append('svg').attr('width', 20).attr('height', 10);
      const l = sv.append('line').attr('x1', 1).attr('x2', 19).attr('y1', 5).attr('y2', 5)
        .attr('stroke', '#363636').attr('stroke-width', 2).attr('stroke-linecap', 'round');
      if (it.dash) l.attr('stroke-dasharray', DASH);
    }
    span.node().append(it.label);
  });
}

function drawChart(sel, key) {
  const isAfter = key === 'after';
  const colorOf = s => isAfter ? AFTER[s.city] : BEFORE[s.k];
  if (isAfter) legendRow(sel, [{ label: '2025년' }, { label: '2024년', dash: true }]);
  else legendRow(sel, SERIES.map(s => ({ dot: true, color: colorOf(s), label: s.k })));

  const plotW = iW - (isAfter ? LABEL_W : 16);
  const x = d3.scaleLinear().domain([1, 31]).range([0, plotW]);
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.selectAll('line.gy').data(yTicks).join('line')
    .attr('x1', 0).attr('x2', plotW).attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  // Y축 (맨 위 tick에만 단위)
  g.append('g').call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(8)
      .tickFormat(d => d === 10 ? '10°C' : d))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues([1, 15, 31]).tickSize(0).tickPadding(8).tickFormat(d => d + '일'))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);

  const line = d3.line().x((d, i) => x(months[i])).y(d => y(d)).curve(d3.curveMonotoneX);
  SERIES.forEach(s => {
    const p = g.append('path').datum(s.v).attr('d', line).attr('fill', 'none')
      .attr('stroke', colorOf(s)).attr('stroke-width', 2).attr('stroke-linecap', 'round');
    if (isAfter && s.period === 'norm') p.attr('stroke-dasharray', DASH);
  });
  // After: 도시 이름을 두 선(올해·평년) 끝의 가운데에 직접 표시
  if (isAfter) {
    ['서울', '부산'].forEach(c => {
      const ends = SERIES.filter(s => s.city === c).map(s => s.v[s.v.length - 1]);
      g.append('text').attr('x', plotW + 6).attr('y', y(d3.mean(ends))).attr('dy', '0.34em')
        .style('font-size', '13px').style('font-weight', 700).style('fill', AFTER[c]).style('font-family', FONT)
        .text(c);
    });
  }
}
['before', 'after'].forEach(k => drawChart('#' + k + '-normal', k));
</script>
</body>
</html>

</body></html>
