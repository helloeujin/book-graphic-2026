<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서로 구분하기 쉬운 색 고르기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #fff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    padding: 40px 20px;
  }
  .container { max-width: 620px; margin: 0; }

  .compare-wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .panel {
    flex: 1 1 236px;
  }
  .panel-header {
    font-size: 13px;
    font-weight: 500;
    color: #363636;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid #ddd;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 3px 10px;
    color: #ffffff;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 6px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    line-height: 13px;
    color: #363636;
  }
  .legend-item i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .result {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #363636;
    padding-top: 0;
    margin-top: -4px;
  }
  .result strong { font-weight: 700; }
</style>
</head>
<body>
  <div class="container">
    <div class="compare-wrap">
      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-worse">Worse</span>
          <span class="panel-desc">색상이 비슷한 파랑 계열</span>
        </div>
        <div class="legend" id="lg-worse"></div>
        <div id="chart-worse"></div>
        <p class="result"><strong>결과:</strong> 세 색이 비슷해 어느 선이 어느 항목인지 범례를 반복해서 확인해야 합니다.</p>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-better">Better</span>
          <span class="panel-desc">색상 차이가 충분한 파랑·주황·초록</span>
        </div>
        <div class="legend" id="lg-better"></div>
        <div id="chart-better"></div>
        <p class="result"><strong>결과:</strong> 색상 차이가 충분해 각 선을 한눈에 구분할 수 있습니다.</p>
      </div>
    </div>
  </div>

<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 200;
const margin = { top: 14, right: 12, bottom: 30, left: 30 };
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;

const months = ['1월','2월','3월','4월','5월'];
const NAMES = ['버스','지하철','자전거'];
// 두 패널 모두 같은 데이터 → 색만 다름
const DATA = [
  [22, 25, 24, 30, 32],
  [34, 32, 36, 35, 38],
  [8, 10, 14, 18, 22]
];

// tokens.json palette
const PALETTE = {
  worse:  ['#0b66d6', '#184687', '#0278c7'],  // blue.base, blue-600, lightblue.base
  better: ['#0b66d6', '#c95c03', '#3b8601']   // blue.base, orange.base, green.base
};

const x = d3.scalePoint().domain(months).range([0, iW]);
const y = d3.scaleLinear().domain([0, 40]).range([iH, 0]);
const yTicks = [0, 20, 40];

function drawPanel(key) {
  const colors = PALETTE[key];

  const lg = d3.select(`#lg-${key}`);
  NAMES.forEach((n, i) => {
    const item = lg.append('span').attr('class', 'legend-item');
    item.append('i').style('background', colors[i]);
    item.node().append(n);
  });

  const svg = d3.select(`#chart-${key}`).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // 그리드 (zero 제외)
  g.selectAll('line.grid').data(yTicks.filter(d => d !== 0)).join('line')
    .attr('class', 'grid')
    .attr('x1', 0).attr('x2', iW)
    .attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);

  // zero line
  g.append('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', y(0)).attr('y2', y(0))
    .style('stroke', '#363636').style('stroke-opacity', 0.4);

  // Y축
  g.append('g')
    .call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);

  // X축
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues(['1월','3월','5월']).tickSize(4).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .call(a => a.selectAll('.tick line').style('stroke', '#aaaaaa'))
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);

  // 선
  DATA.forEach((v, i) => {
    g.append('path').datum(v)
      .attr('d', d3.line().x((d, k) => x(months[k])).y(d => y(d)))
      .attr('fill', 'none').attr('stroke', colors[i]).attr('stroke-width', 2.5);
    g.append('circle')
      .attr('cx', x(months[months.length - 1])).attr('cy', y(v[v.length - 1]))
      .attr('r', 3.5).attr('fill', colors[i]);
  });
}

drawPanel('worse');
drawPanel('better');
</script>
</body>
</html>
