<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-4 색상 조합 개선</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .cond { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .cond-name { font-size: 13px; color: #999999; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 13px; color: #363636; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sub { margin-bottom: 14px; }
  .result { font-size: 13px; line-height: 17px; font-weight: 400; color: #363636; margin-top: 2px; }
  .result strong { font-weight: 700; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <div class="panel">
      <div class="panel-header"><span class="badge badge-worse">Before</span><span>빨강과 초록으로 진행 상태 구분</span></div>
      <div class="sub" id="before-normal"></div>
      <div class="sub" id="before-sim"></div>
      <p class="result"><strong>결과:</strong> 녹색맹 조건에서 두 색이 비슷해져 지연된 업무를 찾기 어렵습니다.</p>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="badge badge-better">After</span><span>파랑과 주황으로 진행 상태 구분</span></div>
      <div class="sub" id="after-normal"></div>
      <div class="sub" id="after-sim"></div>
      <p class="result"><strong>결과:</strong> 같은 조건에서도 두 색의 차이가 유지되어 지연된 업무가 바로 보입니다.</p>
    </div>
  </div>
  <p class="source">웹 서비스 개편 프로젝트의 업무별 일정(주 단위), 예시 데이터. 각 패널의 아래 차트는 녹색맹(deuteranopia) 조건을 Machado et al.(2009) 모델로 시뮬레이션한 모습입니다.</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
// 녹색맹(deuteranopia, severity 1.0) 시뮬레이션: Machado, Oliveira & Fernandes (2009)
// 선형 RGB에서 행렬을 적용한 뒤 sRGB로 되돌림 (colorspacious 구현과 값 일치 확인)
const M = [[0.367322, 0.860646, -0.227968],
           [0.280085, 0.672501,  0.047413],
           [-0.011820, 0.042940, 0.968881]];
const toLin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const toSrgb = c => { c = Math.min(1, Math.max(0, c));
  return Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055)); };
function simulate(hex) {
  const c = d3.rgb(hex), lin = [c.r, c.g, c.b].map(toLin);
  const out = M.map(row => toSrgb(row[0] * lin[0] + row[1] * lin[1] + row[2] * lin[2]));
  return d3.rgb(...out).formatHex();
}
const simAll = C => Object.fromEntries(Object.entries(C).map(([k, v]) => [k, simulate(v)]));
function condHeader(sel, name, items) {
  const h = d3.select(sel).append('div').attr('class', 'cond');
  h.append('span').attr('class', 'cond-name').text(name);
  items.forEach(([color, label]) => {
    const it = h.append('span').attr('class', 'legend-item');
    it.append('i').style('background', color);
    it.node().append(label);
  });
}

const W = 298, H = 176;
const margin = { top: 20, right: 22, bottom: 24, left: 96 };
const iW = W - margin.left - margin.right, iH = H - margin.top - margin.bottom;

// 예시 데이터: 도입 예시와 같은 일정
const data = [
  { k: '요구사항 정의', s: 0,  e: 2,  late: false },
  { k: '디자인 시안',   s: 1,  e: 7,  late: true  },
  { k: '프론트 개발',   s: 4,  e: 9,  late: false },
  { k: '백엔드 개발',   s: 3,  e: 8,  late: false },
  { k: '데이터 연동',   s: 5,  e: 9,  late: true  },
  { k: 'QA 테스트',     s: 8,  e: 11, late: false },
  { k: '출시 준비',     s: 10, e: 12, late: false }
];
const TODAY = 6;

// tokens.json base
const PALETTE = {
  before: { ok: '#3b8601', late: '#cc2b0c' },
  after:  { ok: '#0b66d6', late: '#c95c03' }
};

const y = d3.scaleBand().domain(data.map(d => d.k)).range([0, iH]).padding(0.25);
const x = d3.scaleLinear().domain([0, 12]).range([0, iW]);
const xTicks = [0, 4, 8, 12];

function drawChart(sel, C, name) {
  condHeader(sel, name, [[C.ok, '계획대로'], [C.late, '지연']]);
  const svg = d3.select(sel).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  g.selectAll('line.gx').data(xTicks).join('line')
    .attr('y1', 0).attr('y2', iH).attr('x1', d => x(d)).attr('x2', d => x(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickSize(0).tickPadding(8)
      .tickFormat(d => d === 12 ? '12주' : d))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
  g.selectAll('rect').data(data).join('rect')
    .attr('x', d => x(d.s)).attr('y', d => y(d.k)).attr('height', y.bandwidth())
    .attr('width', d => x(d.e) - x(d.s)).attr('fill', d => d.late ? C.late : C.ok);
  g.selectAll('text.name').data(data).join('text')
    .attr('x', -8).attr('y', d => y(d.k) + y.bandwidth() / 2).attr('dy', '0.34em')
    .attr('text-anchor', 'end').style('font-size', '13px').style('fill', '#363636').style('font-family', FONT)
    .text(d => d.k);
  g.append('line').attr('x1', x(TODAY)).attr('x2', x(TODAY)).attr('y1', -4).attr('y2', iH)
    .style('stroke', '#363636').style('stroke-width', 1);
  g.append('text').attr('x', x(TODAY)).attr('y', -8).attr('text-anchor', 'middle')
    .style('font-size', '13px').style('fill', '#363636').style('font-family', FONT).text('오늘');
}
['before', 'after'].forEach(k => {
  drawChart('#' + k + '-normal', PALETTE[k], '일반');
  drawChart('#' + k + '-sim', simAll(PALETTE[k]), '녹색맹 시뮬레이션');
});
</script>
</body>
</html>

</body></html>
