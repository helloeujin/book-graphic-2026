<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3-3 위계 도넛 예시</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 620px; margin: 0; }
  .compare-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { flex: 1 1 236px; min-width: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .container > .panel-header { margin-bottom: 4px; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>

<div class="container">
  <div class="panel-header"><span>오바마 대통령 국정 지지율(%)</span></div>
  <div class="compare-wrap">
    <div class="panel"><div id="chart-women"></div></div>
    <div class="panel"><div id="chart-men"></div></div>
  </div>
  <p class="source">출처: 확인 필요</p>
</div>

<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const W = 298, H = 213;
const R = 74, r = 44;
const cx = W / 2, cy = 92;

// 2015년 1월 국정 지지율(%)
const DATA = {
  women: [{ k: '반대', v: 50 }, { k: '의견 없음', v: 1 }, { k: '지지', v: 49 }],
  men:   [{ k: '반대', v: 54 }, { k: '의견 없음', v: 2 }, { k: '지지', v: 44 }]
};
// tokens.json base: 청록(여성), 보라(남성). 반대는 같은 계열을 흰색과 섞어 밝게, 의견 없음은 회색
const BASE = { women: '#029e94', men: '#824cd5' };
const NAME = { women: '여성', men: '남성' };
const GRAY = '#c4c4c4';

function draw(key) {
  const base = BASE[key];
  const light = d3.interpolateRgb(base, '#ffffff')(0.55);
  const color = { '지지': base, '반대': light, '의견 없음': GRAY };

  const svg = d3.select('#chart-' + key).append('svg').attr('width', W).attr('height', H)
    .attr('viewBox', `0 0 ${W} ${H}`).style('max-width', '100%').style('height', 'auto');
  const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);
  const arcs = d3.pie().value(d => d.v).sort(null)(DATA[key]);
  const arc = d3.arc().innerRadius(r).outerRadius(R);

  g.selectAll('path').data(arcs).join('path')
    .attr('d', arc).attr('fill', a => color[a.data.k])
    .attr('stroke', '#fff').attr('stroke-width', 1);

  g.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
    .style('font-size', '14px').style('font-weight', 700).style('font-family', FONT).style('fill', '#363636')
    .text(NAME[key]);

  const get = k => arcs.find(a => a.data.k === k);
  const txt = (x, y, anchor, name, val) => {
    const t = g.append('text').attr('x', x).attr('y', y).attr('text-anchor', anchor)
      .style('font-size', '13px').style('font-family', FONT).style('fill', '#363636');
    t.append('tspan').attr('x', x).text(name);
    t.append('tspan').attr('x', x).attr('dy', '1.3em').style('font-weight', 700).text(val + '%');
  };
  const leader = pts => g.append('polyline').attr('points', pts.map(p => p.join(',')).join(' '))
    .attr('fill', 'none').attr('stroke', '#aaaaaa').attr('stroke-width', 0.8);

  // 지지: 왼쪽
  const ax = -R - 6;
  leader([[-R, 0], [ax - 8, 0], [ax - 8, -40]]);
  txt(ax - 8, -64, 'middle', '지지', get('지지').data.v);
  // 반대: 오른쪽
  leader([[R, 0], [-ax + 8, 0], [-ax + 8, -40]]);
  txt(-ax + 8, -64, 'middle', '반대', get('반대').data.v);
  // 의견 없음: 아래
  const n = get('의견 없음');
  const mid = (n.startAngle + n.endAngle) / 2;
  const px = Math.sin(mid) * R, py = -Math.cos(mid) * R;
  leader([[px, py], [px, R + 18], [px + 10, R + 18]]);
  g.append('text').attr('x', px + 14).attr('y', R + 18).attr('dy', '0.35em')
    .style('font-size', '13px').style('font-family', FONT).style('fill', '#363636')
    .call(t => { t.append('tspan').style('font-weight', 700).text(n.data.v + '% '); t.append('tspan').text('의견 없음'); });
}
draw('women');
draw('men');
</script>

</body></html>
