<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>색의 의미를 일관되게 유지하기 - Better</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  :root[data-theme="dark"] { --bg: #fff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); padding: 40px 20px; }
  .container { max-width: 760px; margin: 0; }
  .panel-header { font-size: 13px; font-weight: 500; color: #363636; display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #ddd; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 3px 10px; color: #ffffff;
    letter-spacing: 0.03em; flex-shrink: 0; }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }
  .compare-wrap { display: flex; gap: 12px; flex-wrap: nowrap; }
  .panel { flex: 0 0 auto; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 6px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 14px; color: #363636; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-item b { margin-left: auto; font-weight: 400; color: #777777; }
  .source { font-size: 13px; line-height: 17px; color: #777777; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="panel-header"><span class="badge badge-better">Better</span><span>국가별 색을 고정하고 카테고리를 맞춘 두 차트</span></div>
  <div class="compare-wrap">
    <div class="panel"><div id="c0"></div></div>
    <div class="panel"><div id="c1"></div></div>
  </div>
  <p class="source">출처: 통계청, 온라인 해외 직접 구매액 지역별 구성비(%). 유럽연합+영국과 기타는 원자료를 합산</p>
</div>
<script>
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
// 국가별 색 고정 + 두 해 같은 카테고리·같은 순서 (tokens.json)
const COLOR = { '미국': '#0b66d6', '중국': '#cc2b0c', '유럽연합+영국': '#824cd5', '일본': '#029e94', '기타': '#a4a4a4' };
// 색은 국가별로 고정, 조각 순서는 각 해의 값 순서(기타는 마지막)
function fixed(vals) {
  return Object.keys(vals).sort((a, b) => (a === '기타') - (b === '기타') || vals[b] - vals[a])
    .map(k => ({ k, v: vals[k], c: COLOR[k] }));
}
const DATA = [
  { year: '2022년 3/4분기', total: '1조 3,065억 원',
    items: fixed({ '미국': 36.4, '중국': 30.4, '유럽연합+영국': 20.1, '일본': 8.1, '기타': 5.1 }) },
  { year: '2023년 3/4분기', total: '1조 6,300억 원',
    items: fixed({ '미국': 27.8, '중국': 50.3, '유럽연합+영국': 11.6, '일본': 6.7, '기타': 3.8 }) }
];
const PCT = (s, d) => s.k === '미국'; // 두 차트 모두 같은 카테고리에 %
const W_PAD = 10, R = 64, r = 42, GAP = 16;

function drawDonut(sel, d) {
  const svg = d3.select(sel).append('svg');
  const g = svg.append('g');
  const pie = d3.pie().value(s => s.v).sort(null);
  const arc = d3.arc().innerRadius(r).outerRadius(R);
  const arcs = pie(d.items);

  g.selectAll('path').data(arcs).join('path')
    .attr('d', arc).attr('fill', a => a.data.c).attr('stroke', '#fff').attr('stroke-width', 1);

  // 가운데 텍스트: 연도만
  const [yr, q] = d.year.split(' ');
  const ct = g.append('text').attr('text-anchor', 'middle')
    .style('font-size', '12px').style('fill', '#777777').style('font-family', FONT);
  ct.append('tspan').attr('x', 0).attr('dy', '-0.25em').text(yr);
  ct.append('tspan').attr('x', 0).attr('dy', '1.3em').text(q);

  // 직접 레이블: 좌우로 나누고 아래에서 위로 쌓아 겹침 방지
  const TOP_WRAP = 0.3; // 12시 바로 앞, 1% 미만 조각은 오른쪽 위로
  const labels = arcs.map(a => {
    const mid = (a.startAngle + a.endAngle) / 2;
    const wrap = mid > 2 * Math.PI - TOP_WRAP && a.data.v < 1;
    const side = (mid < Math.PI || wrap) ? 1 : -1;
    const ax = Math.sin(mid) * R, ay = -Math.cos(mid) * R;
    const ex = Math.sin(mid) * (R + 8), ey = -Math.cos(mid) * (R + 8);
    return { a, mid, side, wrap, ax, ay, ex, ey, y: ey };
  });
  [1, -1].forEach(side => {
    const L = labels.filter(l => l.side === side).sort((p, q) => {
      if (p.wrap !== q.wrap) return p.wrap ? -1 : 1;
      if (p.wrap && q.wrap) return q.mid - p.mid;
      return p.ey - q.ey;
    });
    for (let i = L.length - 2; i >= 0; i--)
      if (L[i + 1].y - L[i].y < GAP) L[i].y = L[i + 1].y - GAP;
  });

  labels.forEach(l => {
    const tx = l.side * (R + 19);
    g.append('polyline')
      .attr('points', `${l.ax},${l.ay} ${l.ex},${l.ey} ${l.side * (R + 15)},${l.y}`)
      .attr('fill', 'none').attr('stroke', '#aaaaaa').attr('stroke-width', 0.8);
    const t = g.append('text').attr('x', tx).attr('y', l.y).attr('dy', '0.34em')
      .attr('text-anchor', l.side > 0 ? 'start' : 'end')
      .style('font-size', '12px').style('font-family', FONT);
    t.append('tspan').style('fill', '#363636').text(l.a.data.k + ' ');
    const pct = PCT(l.a.data, d);
    t.append('tspan').style('fill', '#363636').style('font-weight', 700)
      .text(l.a.data.v.toFixed(1) + (pct ? '%' : ''));
  });
  return { svg, g };
}

// 웹폰트가 로드된 뒤에 그려야 레이블 폭을 정확히 잴 수 있음
document.fonts.ready.then(() => {
// 두 차트를 같은 축척으로 맞추고, 한 줄에 들어가도록 필요할 때만 축소
const charts = DATA.map((d, i) => drawDonut('#c' + i, d));
let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
charts.forEach(({ g }) => {
  const b = g.node().getBBox();
  x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.width);
  y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.height);
});
x0 -= W_PAD; x1 += W_PAD; y0 -= W_PAD; y1 += W_PAD;
const GAP_PX = 12;
const avail = document.querySelector('.container').clientWidth;
const k = Math.min(1, (avail - GAP_PX) / (2 * (x1 - x0)));
charts.forEach(({ svg }) => svg
  .attr('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`)
  .attr('width', (x1 - x0) * k).attr('height', (y1 - y0) * k)
  .style('display', 'block').style('overflow', 'visible'));
});
</script>
</body>
</html>
