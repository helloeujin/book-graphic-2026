<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-4 색각 시뮬레이션 — 프로젝트 일정</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme:light; --bg:#fff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); padding:40px 20px; font-family:'Pretendard','Noto Sans KR',sans-serif; color:#363636; }
.container { max-width:620px; }
.compare-wrap { display:flex; gap:24px; flex-wrap:wrap; }
.panel { flex:1 1 270px; min-width:0; }
.panel-header { display:flex; align-items:center; gap:8px; padding-bottom:8px; margin-bottom:14px; border-bottom:1px solid #ddd; font-size:13px; font-weight:500; }
.badge { font-size:12px; font-weight:700; border-radius:4px; padding:3px 10px; color:white; flex-shrink:0; }
.badge-original { background:#4b4b4b; }
.badge-sim { background:#826331; }
.legend { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; }
.legend-item { display:inline-flex; align-items:center; gap:6px; font-size:12px; }
.swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }
.chart { width:100%; display:block; overflow:visible; }
.result { margin-top:10px; font-size:13px; line-height:1.5; }
.result strong { font-weight:700; }
.source { margin-top:18px; color:#777; font-size:12px; line-height:1.6; }
@media (max-width:600px) { .compare-wrap { gap:26px; } .panel { flex-basis:100%; max-width:340px; } }
</style>
</head>
<body>
<div class="container">
  <div class="compare-wrap">
    <section class="panel">
      <div class="panel-header"><span class="badge badge-original">원본</span><span>프로젝트 일정과 진행 상태</span></div>
      <div class="legend" id="legend-original"></div>
      <svg class="chart" id="chart-original" role="img" aria-label="업무별 예정 일정. 초록은 정상 진행, 빨강은 일정 지연" viewBox="0 0 298 225"></svg>
    </section>
    <section class="panel">
      <div class="panel-header"><span class="badge badge-sim">시뮬레이션</span><span>녹색맹 색각 조건</span></div>
      <div class="legend" id="legend-sim"></div>
      <svg class="chart" id="chart-sim" role="img" aria-label="동일한 프로젝트 일정에 녹색맹 색각 시뮬레이션을 적용한 차트" viewBox="0 0 298 225"></svg>
    </section>
  </div>
  <p class="result"><strong>결과:</strong> 업무별 예정 기간은 그대로 읽을 수 있지만, 색 구분이 어려워지면 어떤 업무가 지연됐는지 파악하기 어렵습니다.</p>
  <p class="source">프로젝트 일정 및 진행 상태는 예시 데이터입니다. 오른쪽은 Machado 등(2009)의 색각 시뮬레이션 행렬(Deuteranopia, severity 1.0)을 sRGB 색상에 적용한 근사 결과입니다. 실제 색각 경험은 개인마다 다를 수 있습니다.</p>
</div>
<script>
const DATA = [
  {name:'기획',start:1,end:6,status:'normal'},
  {name:'디자인',start:4,end:12,status:'delayed'},
  {name:'개발',start:8,end:19,status:'normal'},
  {name:'콘텐츠 제작',start:9,end:17,status:'delayed'},
  {name:'테스트',start:17,end:24,status:'normal'}
];
const COLORS={normal:'#3b8601',delayed:'#cc2b0c'};
// Machado, Oliveira & Fernandes (2009): 100% deuteranopia matrix.
const DEUTERANOPIA=[
 [0.367322,0.860646,-0.227968],
 [0.280085,0.672501,0.047413],
 [-0.011820,0.042940,0.968881]
];
function toLinear(c){c/=255;return c<=0.04045?c/12.92:((c+0.055)/1.055)**2.4;}
function toSrgb(c){c=Math.max(0,Math.min(1,c));return Math.round(255*(c<=0.0031308?12.92*c:1.055*c**(1/2.4)-0.055));}
function simulate(hex){
 const channels=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).map(toLinear);
 const out=DEUTERANOPIA.map(row=>toSrgb(row.reduce((s,a,i)=>s+a*channels[i],0)));
 return '#'+out.map(v=>v.toString(16).padStart(2,'0')).join('');
}
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs={},text){
 const e=document.createElementNS(NS,tag);
 for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);
 if(text!==undefined)e.textContent=text;
 return e;
}
function draw(key,colors){
 const svg=document.getElementById('chart-'+key);
 const legend=document.getElementById('legend-'+key);
 [['normal','정상 진행'],['delayed','일정 지연']].forEach(([k,label])=>{
   const item=document.createElement('span');item.className='legend-item';
   const swatch=document.createElement('i');swatch.className='swatch';swatch.style.background=colors[k];
   item.append(swatch,document.createTextNode(label));legend.append(item);
 });
 const left=76,right=8,top=31,bottom=25,plotW=298-left-right,plotH=225-top-bottom;
 const x=day=>left+(day-1)/24*plotW;
 [1,8,15,22].forEach(day=>{
   const px=x(day);
   svg.append(svgEl('line',{x1:px,y1:top-7,x2:px,y2:top+plotH-9,stroke:'#e5e5e5','stroke-width':1}));
   svg.append(svgEl('text',{x:px,y:14,'text-anchor':'middle',fill:'#999','font-size':11,'font-family':'Pretendard, Noto Sans KR, sans-serif'},`10/${day}`));
 });
 DATA.forEach((d,i)=>{
   const y=top+i*35;
   svg.append(svgEl('text',{x:left-9,y:y+10,'text-anchor':'end',fill:'#363636','font-size':12,'font-family':'Pretendard, Noto Sans KR, sans-serif'},d.name));
   svg.append(svgEl('rect',{x:x(d.start),y:y,width:x(d.end)-x(d.start),height:19,rx:2,fill:colors[d.status]}));
 });
}
draw('original',COLORS);
draw('sim',Object.fromEntries(Object.entries(COLORS).map(([k,v])=>[k,simulate(v)])));
</script>
</body>
</html>
