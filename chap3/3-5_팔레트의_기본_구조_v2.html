<div class="chapter">3-5. 데이터 시각화 팔레트의 기본 구조</div>
<section class="group"><div class="group-header">정보의 시각적 우선순위를 보여주는 색</div><div class="priority"><div class="chart"><div class="legend"><span class="legend-item"><i style="background:#b9c0c7"></i>중립색 <span class="muted">Neutral</span></span><span class="legend-item"><i style="background:#327BE4"></i>강조색 <span class="muted">Highlight</span></span></div><svg width="100%" viewBox="-24 0 334 208" role="img" aria-label="A부터 E까지 막대 중 D만 파란색으로 강조"><line x1="8" y1="118.0" x2="303" y2="118.0" stroke="#e5e5e5"/><line x1="8" y1="66.0" x2="303" y2="66.0" stroke="#e5e5e5"/><line x1="8" y1="14.0" x2="303" y2="14.0" stroke="#e5e5e5"/><g class="axis-label" text-anchor="end"><text x="2" y="174.0">0</text><text x="2" y="122.0">30</text><text x="2" y="70.0">60</text><text x="2" y="18.0">90</text></g><rect x="19" y="92.0" width="36" height="78.0" fill="#b9c0c7"/><rect x="78" y="55.6" width="36" height="114.4" fill="#b9c0c7"/><rect x="137" y="112.8" width="36" height="57.2" fill="#b9c0c7"/><rect x="196" y="24.4" width="36" height="145.6" fill="#327BE4"/><rect x="255" y="76.4" width="36" height="93.6" fill="#b9c0c7"/><line x1="8" y1="170" x2="303" y2="170" stroke="#999"/><g class="axis-label" text-anchor="middle"><text x="37" y="188">A</text><text x="96" y="188">B</text><text x="155" y="188">C</text><text x="214" y="188">D</text><text x="273" y="188">E</text></g></svg></div><div class="priority-note"><p>중립색으로 비교에 필요한 맥락을 남기고, 강조색으로 중요한 <strong>D 항목</strong>을 드러냅니다.</p></div></div></section>
<section class="group"><div class="group-header">데이터의 구조를 표현하는 색</div><div class="pal-wrap"><div class="pal"><div class="palette-title">범주형 <span>Categorical</span></div><div class="chips"><i style="background:#eaba04"></i><i style="background:#3b8601"></i><i style="background:#824cd5"></i><i style="background:#cc2b0c"></i></div><div class="ends even"><span>A</span><span>B</span><span>C</span><span>D</span></div><p class="explain">서로 다른 종류를 구분</p></div><div class="pal"><div class="palette-title">순차형 <span>Sequential</span></div><div class="chips joined"><i style="background:#C3D9F9"></i><i style="background:#89B3F0"></i><i style="background:#4B88E2"></i><i style="background:#114081"></i></div><div class="ends"><span>낮음</span><span>높음</span></div><p class="explain">값의 크기와 순서를 표현</p></div><div class="pal"><div class="palette-title">발산형 <span>Diverging</span></div><div class="chips joined"><i style="background:#0C54A0"></i><i style="background:#488ACB"></i><i style="background:#98C3E8"></i><i style="background:#F7F7F7;box-shadow:inset 0 0 0 1px #d6d6d6"></i><i style="background:#E9B999"></i><i style="background:#D77343"></i><i style="background:#AB331F"></i></div><div class="ends center"><span>감소</span><span>0%</span><span>증가</span></div><p class="explain">기준값을 중심으로 두 방향을 표현</p></div></div></section><p class="footnote">※ 팔레트의 역할을 설명하기 위한 가상 예시입니다.</p></div></body></html>
