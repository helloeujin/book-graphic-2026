<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레이더 차트 Do vs Don't</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Pretendard','Noto Sans KR',sans-serif; background:#fff; padding:40px 20px; }

    .panels { display:flex; gap:32px; align-items:flex-start; }
    .panel  { padding:16px; display:inline-block; }

    .panel-label {
      font-size:13px; font-weight:500; color:#363636;
      display:flex; align-items:center; gap:8px;
      padding-bottom:8px; margin-bottom:14px;
      border-bottom:1px solid #ddd;
    }
    .badge {
      font-size:12px; font-weight:700;
      border-radius:4px; padding:3px 10px;
      color:#fff; letter-spacing:0.03em; flex-shrink:0;
    }
    .badge-do   { background:#37760a; }
    .badge-dont { background:#b8351b; }

    .desc {
      font-size:12px; color:#838383; margin-top:8px;
      line-height:16px;
    }

    .legend { display:flex; gap:12px; margin-bottom:4px; }
    .legend-item { display:flex; align-items:center; gap:5px; font-size:12px; color:#363636; }
    .legend-dot  { width:9px; height:9px; border-radius:50%; display:inline-block; }
  </style>
</head>
<body>
<div class="panels">

  <!-- Do: 같은 기준(100점) -->
  <div class="panel">
    <p class="panel-label"><span class="badge badge-do">Do</span>같은 기준(100점)으로 변환</p>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#6565FF;"></span>선수 A</span>
      <span class="legend-item"><span class="legend-dot" style="background:#a4a4a4;"></span>선수 B</span>
    </div>
    <div id="chart-do"></div>
    <p class="desc">축구 선수 A vs B — 능력치 (0–100점)</p>
  </div>

  <!-- Don't: 단위가 제각각 -->
  <div class="panel">
    <p class="panel-label"><span class="badge badge-dont">Don't</span>단위가 다른 값을 그대로 사용</p>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#6565FF;"></span>선수 A</span>
      <span class="legend-item"><span class="legend-dot" style="background:#a4a4a4;"></span>선수 B</span>
    </div>
    <div id="chart-dont"></div>
    <p class="desc">속도(km/h), 경기 수(회), 패스 성공(개), 몸무게(kg), 연봉(억원)</p>
  </div>

</div>

<script>
const COLOR_A = '#6565FF';
const COLOR_B = '#a4a4a4';

/* ── DO 데이터: 0-100점 동일 기준 ── */
const doAxes = ['속도', '체력', '패스', '수비', '드리블'];
const doSeries = [
  { name:'선수 A', color:COLOR_A, fill:'rgba(101,101,255,0.12)', values:[82, 74, 88, 61, 90] },
  { name:'선수 B', color:COLOR_B, fill:'rgba(164,164,164,0.12)', values:[65, 88, 72, 85, 58] },
];

/* ── DON'T 데이터: 단위가 제각각 → 시각적 왜곡 ── */
const dontAxes = ['속도\n(km/h)', '경기 수\n(회)', '패스 성공\n(개)', '몸무게\n(kg)', '연봉\n(억원)'];
const dontMax = [35, 38, 1800, 90, 150];
const dontSeries = [
  { name:'선수 A', color:COLOR_A, fill:'rgba(101,101,255,0.12)',
    values:[31, 28, 1620, 74, 120]
  },
  { name:'선수 B', color:COLOR_B, fill:'rgba(164,164,164,0.12)',
    values:[27, 35, 810, 88, 85]
  },
];

function drawRadar(containerId, axes, seriesData, maxVal) {
  const W = 220, H = 210;
  const cx = W / 2, cy = H / 2 + 4;
  const R  = 72;
  const LEVELS = 4;
  const n = axes.length;
  const step = (2 * Math.PI) / n;
  const angle = i => -Math.PI / 2 + step * i;

  /* 값 → 좌표 (단일 max or 축별 max) */
  const toXY = (val, i, max) => {
    const r = Array.isArray(max) ? val / max[i] : val / max;
    return {
      x: cx + r * R * Math.cos(angle(i)),
      y: cy + r * R * Math.sin(angle(i))
    };
  };

  const svg = d3.select(containerId).append('svg')
    .attr('width',W).attr('height',H).attr('xmlns','http://www.w3.org/2000/svg');

  /* 동심 다각형 그리드 */
  for (let lv = 1; lv <= LEVELS; lv++) {
    const r = (lv / LEVELS) * R;
    const pts = d3.range(n).map(i => [
      cx + r * Math.cos(angle(i)),
      cy + r * Math.sin(angle(i))
    ]);
    svg.append('polygon')
      .attr('points', pts.map(p=>p.join(',')).join(' '))
      .attr('fill','none').attr('stroke','#aaaaaa')
      .attr('stroke-width',1).attr('stroke-dasharray','2')
      .attr('stroke-opacity',0.4);
  }

  /* 축 선 */
  d3.range(n).forEach(i => {
    const ex = cx + R * Math.cos(angle(i));
    const ey = cy + R * Math.sin(angle(i));
    svg.append('line')
      .attr('x1',cx).attr('y1',cy).attr('x2',ex).attr('y2',ey)
      .attr('stroke','#aaaaaa').attr('stroke-width',1).attr('stroke-opacity',0.4);
  });

  /* 축 레이블 */
  const OFFSET = 13;
  axes.forEach((ax, i) => {
    const ex = cx + R * Math.cos(angle(i));
    const ey = cy + R * Math.sin(angle(i));
    const dx = ex - cx, dy = ey - cy;
    const len = Math.sqrt(dx*dx + dy*dy);
    const lx = ex + (dx/len) * OFFSET;
    const ly = ey + (dy/len) * OFFSET;
    const lines = ax.split('\n');
    lines.forEach((line, li) => {
      svg.append('text')
        .attr('x', lx).attr('y', ly + li * 13)
        .attr('text-anchor','middle').attr('dominant-baseline','central')
        .attr('font-size','11px').attr('fill','#636363')
        .attr('font-family',"Pretendard,'Noto Sans KR',sans-serif")
        .text(line);
    });
  });

  const pathStr = pts => pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ')+'Z';

  /* 시리즈 */
  seriesData.forEach(s => {
    const coords = s.values.map((v,i) => toXY(v, i, maxVal || 100));
    const zeroCoords = s.values.map((_,i) => ({x:cx, y:cy}));

    const fillPath = svg.append('path')
      .attr('d', pathStr(zeroCoords))
      .attr('fill', s.fill).attr('stroke','none');
    fillPath.transition().duration(800).ease(d3.easeCubicInOut)
      .attr('d', pathStr(coords));

    const strokePath = svg.append('path')
      .attr('d', pathStr(zeroCoords))
      .attr('fill','none').attr('stroke',s.color).attr('stroke-width',1.5);
    strokePath.transition().duration(800).ease(d3.easeCubicInOut)
      .attr('d', pathStr(coords));

    /* 꼭짓점 점 */
    coords.forEach(pt => {
      svg.append('circle')
        .attr('cx',cx).attr('cy',cy).attr('r',3.5)
        .attr('fill',s.color).attr('stroke','#fff').attr('stroke-width',1.5)
        .transition().duration(800).ease(d3.easeCubicInOut)
        .attr('cx',pt.x).attr('cy',pt.y);
    });
  });
}

drawRadar('#chart-do',   doAxes,   doSeries,   100);
drawRadar('#chart-dont', dontAxes, dontSeries, dontMax);
</script>
</body>
</html>
