<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중요한 연결을 쉽게 따라갈 수 있게 만들기</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: #fff;
    padding: 40px 20px;
  }
  .container { max-width: 620px; margin: 0; }

  .compare-wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .panel {
    flex: 1 1 236px;
  }
  .panel-header {
    font-size: 13px;
    font-weight: 500;
    color: #363636;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid #ddd;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 3px 10px;
    color: #ffffff;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }

  .arc-label { font-size: 10px; fill: #363636; font-weight: 500; }
  .arc-label-emph { font-size: 10px; fill: #6565FF; font-weight: 700; }
  .link-label { font-size: 9.5px; fill: #6565FF; font-weight: 700; }

  .result {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #363636;
    margin-top: 10px;
  }
  .result strong { font-weight: 700; }

  .note, .source {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #777777;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="compare-wrap">
      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-worse">Worse</span>
          <span class="panel-desc">모든 연결을 같은 색으로</span>
        </div>
        <div id="chart-worse"></div>
        <p class="result"><strong>결과:</strong> 모든 리본이 같은 진한 색이라 중앙이 뭉쳐 중요한 연결을 찾기 어렵습니다.</p>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-better">Better</span>
          <span class="panel-desc">한 집단(오세아니아) 연결만 강조</span>
        </div>
        <div id="chart-better"></div>
        <p class="result"><strong>결과:</strong> 오세아니아와 이어진 리본만 강조해, 오세아니아가 어느 권역과 교류하는지 바로 보입니다.</p>
      </div>
    </div>

    <p class="note">* 권역 간 교역량을 나타낸 가상 데이터입니다 (실제 통계 아님). 색 규칙: 출발/도착에 오세아니아가 포함된 연결을 강조.</p>
  </div>

<script>
// ── 교류 행렬 (권역 간 교역량, 대칭) ────────────────────────────
const regions = ['동아시아', '동남아', '오세아니아', '서유럽', '북유럽', '북미'];
// 인덱스:        0          1        2            3         4        5
const matrix = [
  //           동아  동남  오세  서유  북유  북미
  /*동아*/    [   0,  92,  64,  14,   9,  16 ],
  /*동남*/    [  92,   0,  78,  10,   7,  11 ],
  /*오세*/    [  64,  78,   0,   8,   6,  22 ],
  /*서유*/    [  14,  10,   8,   0,  88,  90 ],
  /*북유*/    [   9,   7,   6,  88,   0,  34 ],
  /*북미*/    [  16,  11,  22,  90,  34,   0 ]
];

// 배치는 양쪽 동일 (교류 많은 권역끼리 인접)
const order = [0, 1, 2, 5, 3, 4];  // 동아·동남·오세 | 북미·서유·북유
const EMPH_IDX = 2;  // 강조 대상: 오세아니아

const W = 298, H = 250;
const MONO = '#6565FF';   // Worse: 전체 동일 강조색
const EMPH = '#6565FF';   // Better: 강조색 (북미) — Worse와 동일
const FADE = '#bbbbbb';   // Better: 비강조 리본
const ARC_FADE = '#c9c9c9';

function drawChord(selector, mode) {
  const svg = d3.select(selector).append('svg')
    .attr('width', W).attr('height', H)
    .attr('viewBox', `${-W / 2} ${-H / 2} ${W} ${H}`);
  const g = svg.append('g');

  const R = Math.min(W, H) / 2 - 26;
  const m = order.map(r => order.map(c => matrix[r][c]));
  const chord = d3.chord().padAngle(0.06).sortSubgroups(d3.descending)(m);
  const arc = d3.arc().innerRadius(R).outerRadius(R + 8);
  const ribbon = d3.ribbon().radius(R);

  const involvesNM = d => order[d.source.index] === EMPH_IDX || order[d.target.index] === EMPH_IDX;

  // 강조 모드에서는 강조 리본을 나중에 그려 위로 올림
  let ribbonData = chord.slice();
  if (mode === 'emph') {
    ribbonData = [...chord].sort((a, b) => (involvesNM(a) ? 1 : 0) - (involvesNM(b) ? 1 : 0));
  }

  // 리본
  g.append('g')
    .selectAll('path')
    .data(ribbonData)
    .join('path')
      .attr('d', ribbon)
      .attr('fill', d => mode === 'mono' ? MONO : (involvesNM(d) ? EMPH : FADE))
      .attr('fill-opacity', d => mode === 'mono' ? 0.55 : (involvesNM(d) ? 0.65 : 0.5))
      .attr('stroke', 'none');

  // 호 (노드)
  g.append('g')
    .selectAll('path')
    .data(chord.groups)
    .join('path')
      .attr('d', arc)
      .attr('fill', d => mode === 'mono' ? MONO : (order[d.index] === EMPH_IDX ? EMPH : ARC_FADE));

  // 노드 라벨
  g.append('g')
    .selectAll('text')
    .data(chord.groups)
    .join('text')
      .attr('class', d => (mode === 'emph' && order[d.index] === EMPH_IDX) ? 'arc-label-emph' : 'arc-label')
      .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
      .attr('transform', d => {
        const a = d.angle - Math.PI / 2;
        const r = R + 14;
        return `translate(${Math.cos(a) * r},${Math.sin(a) * r})`;
      })
      .attr('text-anchor', d => (d.angle > Math.PI ? 'end' : 'start'))
      .attr('dy', '0.32em')
      .text(d => regions[order[d.index]]);
}

drawChord('#chart-worse', 'mono');
drawChord('#chart-better', 'emph');
</script>
</body>
</html>
