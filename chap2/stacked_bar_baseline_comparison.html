<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>누적 막대 기준선 비교</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Pretendard','Noto Sans KR',sans-serif;
      background:#fff;
      padding:40px 20px;
    }
    .panels { display:flex; gap:24px; align-items:flex-start; }
    .panel  { display:inline-block; }
    .panel-label {
      font-size: 13px;
      font-weight: 500;
      color: #363636;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid #ddd;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      padding: 3px 10px;
      color: #fff;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .badge-worse  { background: #b8351b; }
    .badge-better { background: #37760a; }
    .legend {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      padding-left: 2px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #636363;
      font-family: 'Pretendard','Noto Sans KR',sans-serif;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .source {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
      font-family: 'Pretendard','Noto Sans KR',sans-serif;
    }
  </style>
</head>
<body>

<div class="panels">

  <!-- Worse: 현재 순서 (생산가능이 중간) -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-worse">Worse</span>
      비교 항목이 중간에 위치
    </p>
    <div id="chart-worse"></div>
  </div>

  <!-- Better: 생산가능을 맨 아래로 -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-better">Better</span>
      비교 항목을 맨 아래(기준선)에 배치
    </p>
    <div id="chart-better"></div>
  </div>

</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#888888"></div>
    유소년 (0~14세)
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#6565FF"></div>
    생산가능 (15~64세)
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#bbbbbb"></div>
    고령 (65세+)
  </div>
</div>
<p class="source">출처: <a href="https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=DT_1IN1503" target="_blank" style="color:#999;text-decoration:underline;">통계청 인구총조사 2024</a></p>

<script>
const FONT = "Pretendard,'Noto Sans KR',sans-serif";
const W = 236, H = 200;
const M = { top: 6, right: 12, bottom: 28, left: 36 };
const iW = W - M.left - M.right;
const iH = H - M.top  - M.bottom;

// 2024 인구총조사 실측값 (%)
// values: [유소년(0~14), 생산가능(15~64), 고령(65+)]
const rawData = [
  { region: '서울', values: [8.6,  72.2, 19.2] },
  { region: '경기', values: [11.5, 72.2, 16.3] },
  { region: '부산', values: [9.5,  66.9, 23.6] },
  { region: '강원', values: [9.6,  65.8, 24.6] },
];

const regions = rawData.map(d => d.region);
// index → color: 0=유소년, 1=생산가능, 2=고령
const colorMap = { 0: '#888888', 1: '#6565FF', 2: '#bbbbbb' };

// 정수 픽셀 높이 — 최대나머지법으로 합이 정확히 iH 보장
function segPx(values) {
  const total = values.reduce((a, b) => a + b, 0);
  const raw   = values.map(v => v / total * iH);
  const fl    = raw.map(Math.floor);
  const rem   = raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]);
  let deficit = iH - fl.reduce((a, b) => a + b, 0);
  rem.forEach(([, i]) => { if (deficit-- > 0) fl[i]++; });
  return fl;  // [h_유소년, h_생산가능, h_고령], 합=iH 정확
}

// stackKeys: 아래→위 순서 (예: [0,1,2] or [1,0,2])
// drawOrder: 위→아래 렌더 순서 = stackKeys 역순
function drawBar(containerId, stackKeys) {
  const svg = d3.select(containerId).append('svg').attr('width', W).attr('height', H);
  const g   = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

  const x  = d3.scaleBand().domain(regions).range([0, iW]).padding(0.3);
  const y  = d3.scaleLinear().domain([0, 1]).range([iH, 0]);
  const bw = Math.round(x.bandwidth());

  const yTicks  = [0, 0.25, 0.5, 0.75, 1];
  const drawOrder = [...stackKeys].reverse();  // 위→아래 렌더 순서

  // ① 막대 — 정수 픽셀, top=y:0, bottom=y:iH 보장
  rawData.forEach(d => {
    const px   = segPx(d.values);
    const xPos = Math.round(x(d.region));
    let cumY   = 0;

    drawOrder.forEach((idx, i) => {
      if (i > 0) {
        g.append('line')
          .attr('x1', xPos).attr('x2', xPos + bw)
          .attr('y1', cumY).attr('y2', cumY)
          .style('stroke', '#fff').style('stroke-width', 2);
      }
      g.append('rect')
        .attr('x', xPos).attr('y', cumY)
        .attr('width', bw).attr('height', px[idx])
        .attr('fill', colorMap[idx]);
      cumY += px[idx];
    });
  });

  // ② 흰색 커버 — height:iH→0 으로 줄며 아래→위 reveal
  const cover = g.append('rect')
    .attr('x', 0).attr('y', 0)
    .attr('width', iW).attr('height', iH)
    .attr('fill', '#ffffff');
  cover.transition().duration(800).ease(d3.easeCubicInOut)
    .attr('height', 0);

  // ③ 그리드 (커버 위, 항상 표시) — 0%·100% 제외
  g.selectAll('.grid').data(yTicks.filter(d => d !== 0 && d !== 1)).join('line')
    .attr('class', 'grid')
    .attr('x1', 0).attr('x2', iW)
    .attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);

  // ④ Y축
  g.append('g')
    .call(
      d3.axisLeft(y)
        .tickValues(yTicks).tickSize(0).tickPadding(6)
        .tickFormat(d => `${Math.round(d * 100)}`)
    )
    .call(a => a.select('.domain').remove())
    .selectAll('text')
      .style('font-size', '11px').style('fill', '#999999')
      .style('font-family', FONT).style('text-anchor', 'end');

  g.append('text')
    .attr('x', -6).attr('y', 0).attr('dy', '0.32em').attr('dx', 1)
    .style('text-anchor', 'start').style('font-size', '11px')
    .style('fill', '#999999').style('font-family', FONT).text('%');

  // ⑤ X축
  g.append('g')
    .attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickSize(0).tickPadding(6))
    .call(a => a.select('.domain').remove())
    .selectAll('text')
      .style('font-size', '11px').style('fill', '#636363').style('font-family', FONT);

  // ⑥ 100% 그리드선 — y:0, 막대 상단과 동일
  g.append('line')
    .attr('x1', 12).attr('x2', iW).attr('y1', 0).attr('y2', 0)
    .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);

  // ⑦ zero line — y:iH, 막대 하단과 동일
  g.append('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', iH).attr('y2', iH)
    .style('stroke', '#363636').style('stroke-opacity', 0.4);
}

// Worse: 기존 순서 (유소년→생산가능→고령)
drawBar('#chart-worse', [0, 1, 2]);

// Better: 생산가능 맨 아래 (생산가능→유소년→고령)
drawBar('#chart-better', [1, 0, 2]);
</script>
</body>
</html>
