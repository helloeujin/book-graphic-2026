<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비스웜 vs 박스플롯</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #fff; padding: 40px 20px; }

    .panels { display: flex; gap: 24px; align-items: flex-start; }
    .panel  { padding: 16px 16px 28px 16px; display: inline-block; }

    .panel-label {
      font-size: 13px; font-weight: 500; color: #363636;
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px; margin-bottom: 14px;
      border-bottom: 1px solid #ddd;
    }
    .badge {
      font-size: 12px; font-weight: 700; border-radius: 4px;
      padding: 3px 10px; color: #fff; letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge-worse  { background: #b8351b; }
    .badge-better { background: #37760a; }

    .source { font-size: 13px; line-height: 17px; color: #777; margin-top: 8px; }

    .tooltip {
      position: fixed; pointer-events: none;
      background: rgba(255,255,255,0.95); border: 1px solid #c6c6c6;
      border-radius: 4px; padding: 8px 12px; font-size: 13px; color: #636363;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none;
    }
    .tooltip strong { font-size: 14px; color: #454545; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="panels">

  <!-- Worse: Beeswarm -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-worse">Worse</span>
      점이 뭉쳐 분포 형태를 읽기 어려움
    </p>
    <div id="chart-bsw"></div>
    <p class="source">예시 데이터 (n=100/그룹)</p>
  </div>

  <!-- Better: Box Plot -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-better">Better</span>
      요약 통계로 분포를 선명하게 압축
    </p>
    <div id="chart-box"></div>
    <p class="source">예시 데이터 (n=100/그룹)</p>
  </div>

</div>

<div class="tooltip" id="tooltip">
  <strong id="tt-name"></strong>
  <span id="tt-val"></span>
</div>

<script>
  const FONT   = "Pretendard,'Noto Sans KR',sans-serif";
  const ACCENT = '#6565FF';
  const groups = ['A', 'B', 'C'];

  /* ── 공유 데이터 (100개/그룹) ── */
  const rawData = [];
  const bases   = { A: 28, B: 42, C: 18 };
  const spreads = { A: 14, B: 17, C: 11 };

  groups.forEach(grp => {
    for (let i = 0; i < 100; i++) {
      const v = bases[grp]
        + Math.sin(i * 1.9 + grp.charCodeAt(0) * 0.4) * spreads[grp]
        + Math.cos(i * 0.7 + i * 0.13) * (spreads[grp] * 0.5)
        + Math.sin(i * 0.31) * (spreads[grp] * 0.3);
      rawData.push({ group: grp, value: Math.max(2, Math.min(69, v)) });
    }
  });

  /* ── 공유 치수 ── */
  const W  = 236, H = 260;
  const M  = { top: 6, right: 16, bottom: 30, left: 36 };
  const iW = W - M.left - M.right;   // 184
  const iH = H - M.top  - M.bottom;  // 224

  const xScale = d3.scaleLinear().domain([0, 70]).range([0, iW]);
  const yScale = d3.scaleBand().domain(groups).range([0, iH]).padding(0.2);
  const xTicks = [0, 20, 40, 60];

  /* ── 공통 축/그리드 ── */
  function drawAxes(g) {
    g.selectAll('line.grid').data(xTicks.slice(1)).join('line')
      .attr('x1', d => xScale(d)).attr('x2', d => xScale(d))
      .attr('y1', 0).attr('y2', iH)
      .style('stroke', '#aaaaaa').style('stroke-dasharray', '2').style('stroke-opacity', 0.4);
    g.append('line')
      .attr('x1', xScale(0)).attr('x2', xScale(0))
      .attr('y1', 0).attr('y2', iH)
      .style('stroke', '#363636').style('stroke-opacity', 0.4);
    g.append('g').attr('transform', `translate(0,${iH})`)
      .call(d3.axisBottom(xScale).tickValues(xTicks).tickSize(0).tickPadding(8))
      .call(a => a.select('.domain').remove())
      .selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', FONT);
    g.append('g')
      .call(d3.axisLeft(yScale).tickSize(0).tickPadding(10))
      .call(a => a.select('.domain').remove())
      .selectAll('text').style('font-size', '13px').style('fill', '#636363').style('font-family', FONT);
  }

  /* ── 클립패스 (좌→우 reveal) ── */
  function makeClip(svg, id) {
    svg.append('defs').append('clipPath').attr('id', id)
      .append('rect')
        .attr('x', 0).attr('y', -M.top)
        .attr('width', 0).attr('height', iH + M.top + 4)
        .transition().duration(800).ease(d3.easeCubicInOut)
        .attr('width', iW + M.right);
  }

  /* ══════════════════════════════════
     WORSE — Beeswarm
  ══════════════════════════════════ */
  const svgB = d3.select('#chart-bsw').append('svg').attr('width', W).attr('height', H);
  const gB   = svgB.append('g').attr('transform', `translate(${M.left},${M.top})`);
  drawAxes(gB);
  makeClip(svgB, 'clip-bsw');

  const RADIUS = 2;
  const nodes  = rawData.map(d => ({
    ...d,
    tx: xScale(d.value),
    ty: yScale(d.group) + yScale.bandwidth() / 2
  }));

  d3.forceSimulation(nodes)
    .force('x', d3.forceX(d => d.tx).strength(1))
    .force('y', d3.forceY(d => d.ty).strength(0.9))
    .force('collide', d3.forceCollide(RADIUS + 0.5))
    .stop().tick(120);

  const tooltip = document.getElementById('tooltip');
  const ttName  = document.getElementById('tt-name');
  const ttVal   = document.getElementById('tt-val');

  gB.append('g').attr('clip-path', 'url(#clip-bsw)')
    .selectAll('circle').data(nodes).join('circle')
      .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', RADIUS)
      .attr('fill', '#a4a4a4').attr('fill-opacity', 0.55)
      .attr('stroke', '#fff').attr('stroke-width', 0.4)
      .on('mousemove', function(event, d) {
        d3.select(this).attr('fill', ACCENT).attr('fill-opacity', 1);
        ttName.textContent = `그룹 ${d.group}`;
        ttVal.textContent  = `값: ${d.value.toFixed(1)}`;
        tooltip.style.display = 'block';
        tooltip.style.left = (event.clientX + 14) + 'px';
        tooltip.style.top  = (event.clientY - 28) + 'px';
      })
      .on('mouseleave', function() {
        d3.select(this).attr('fill', '#a4a4a4').attr('fill-opacity', 0.55);
        tooltip.style.display = 'none';
      });

  /* ══════════════════════════════════
     BETTER — Box Plot
  ══════════════════════════════════ */
  const svgX = d3.select('#chart-box').append('svg').attr('width', W).attr('height', H);
  const gX   = svgX.append('g').attr('transform', `translate(${M.left},${M.top})`);
  drawAxes(gX);
  makeClip(svgX, 'clip-box');

  const boxG   = gX.append('g').attr('clip-path', 'url(#clip-box)');
  const boxH   = yScale.bandwidth() * 0.38;
  const capH   = boxH * 0.45;

  groups.forEach(grp => {
    const vals   = rawData.filter(d => d.group === grp).map(d => d.value);
    const sorted = [...vals].sort((a, b) => a - b);
    const q1     = d3.quantile(sorted, 0.25);
    const med    = d3.quantile(sorted, 0.50);
    const q3     = d3.quantile(sorted, 0.75);
    const iqr    = q3 - q1;
    const wLo    = Math.max(d3.min(sorted), q1 - 1.5 * iqr);
    const wHi    = Math.min(d3.max(sorted), q3 + 1.5 * iqr);
    const outliers = sorted.filter(v => v < wLo || v > wHi);
    const cy     = yScale(grp) + yScale.bandwidth() / 2;

    /* 1) 수염 선 */
    boxG.append('line')
      .attr('x1', xScale(wLo)).attr('x2', xScale(wHi))
      .attr('y1', cy).attr('y2', cy)
      .style('stroke', ACCENT).style('stroke-width', 1.5).style('stroke-opacity', 0.7);

    /* 2) 수염 끝 캡 */
    [wLo, wHi].forEach(w => {
      boxG.append('line')
        .attr('x1', xScale(w)).attr('x2', xScale(w))
        .attr('y1', cy - capH / 2).attr('y2', cy + capH / 2)
        .style('stroke', ACCENT).style('stroke-width', 1.5).style('stroke-opacity', 0.7);
    });

    /* 3) IQR 박스 */
    boxG.append('rect')
      .attr('x', xScale(q1))
      .attr('y', cy - boxH / 2)
      .attr('width', xScale(q3) - xScale(q1))
      .attr('height', boxH)
      .attr('rx', 3).attr('ry', 3)
      .attr('fill', '#C4C4FF')
      .attr('stroke', ACCENT).attr('stroke-width', 1.5).attr('stroke-opacity', 0.9);

    /* 4) 중앙값 선 */
    boxG.append('line')
      .attr('x1', xScale(med)).attr('x2', xScale(med))
      .attr('y1', cy - boxH / 2).attr('y2', cy + boxH / 2)
      .style('stroke', ACCENT).style('stroke-width', 3).style('stroke-opacity', 1);

    /* 5) 이상치 — 표시 안 함 */
  });
</script>
</body>
</html>
