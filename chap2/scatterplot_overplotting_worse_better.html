<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>점이 겹칠 때 — 크기와 투명도</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: #fff;
    padding: 40px 20px;
  }
  .container { max-width: 620px; margin: 0 auto; }

  h1 {
    font-size: 17px; line-height: 22px; font-weight: 700;
    color: #363636; padding-bottom: 5px;
  }
  .dek {
    font-size: 15px; line-height: 19px; font-weight: 400;
    color: #777777; padding-bottom: 10px;
  }

  .compare-wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .panel {
    flex: 1 1 236px;
  }
  .panel-header {
    font-size: 13px;
    font-weight: 500;
    color: #363636;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid #ddd;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 3px 10px;
    color: #ffffff;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }

  .axis text { font-size: 13px; fill: #999999; }

  .note {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #777777;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>점이 겹치면, 데이터가 실제보다 적어 보인다</h1>
    <p class="dek">같은 데이터를 큰 불투명한 점과 작은 투명한 점으로 각각 그렸을 때의 차이</p>

    <div class="compare-wrap">
      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-worse">Worse</span>
          <span class="panel-desc">큰 점, 불투명</span>
        </div>
        <div id="chart-worse"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-better">Better</span>
          <span class="panel-desc">작은 점, 투명도 적용</span>
        </div>
        <div id="chart-better"></div>
      </div>
    </div>

    <p class="note">* 개념 설명을 위해 만든 가상 데이터입니다 (실제 통계 아님)</p>
  </div>

<script>
// ── 데이터 생성 (고정 시드 — 매번 동일한 결과) ──────────────────
const rng = d3.randomLcg(0.42);
const rNormal = d3.randomNormal.source(rng);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

const data = [];
const nA = 1260, nB = 540;

const genA_x = rNormal(280, 90);
const genA_y = rNormal(170, 55);
for (let i = 0; i < nA; i++) {
  data.push({ x: clamp(genA_x(), 10, 990), y: clamp(genA_y(), 10, 690) });
}
const genB_x = rNormal(650, 130);
const genB_y = rNormal(380, 100);
for (let i = 0; i < nB; i++) {
  data.push({ x: clamp(genB_x(), 10, 990), y: clamp(genB_y(), 10, 690) });
}

// ── 차트 그리기 함수 ────────────────────────────────────────────
const W = 236, H = 200;
const margin = { top: 6, right: 10, bottom: 30, left: 50 };
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;

const x = d3.scaleLinear().domain([0, 1000]).range([0, iW]);
const y = d3.scaleLinear().domain([0, 700]).range([iH, 0]);
const xTicks = [0, 300, 600, 900];
const yTicks = [0, 200, 400, 600];

function drawChart(selector, { r, opacity }) {
  const svg = d3.select(selector).append('svg')
    .attr('width', W).attr('height', H);

  const g = svg.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  // grid
  g.selectAll('.grid').data(yTicks).join('line')
    .attr('class', 'grid')
    .attr('x1', 0).attr('x2', iW)
    .attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa')
    .style('stroke-dasharray', '2')
    .style('stroke-opacity', 0.4);

  // points
  g.append('g')
    .selectAll('circle')
    .data(data)
    .join('circle')
      .attr('cx', d => x(d.x))
      .attr('cy', d => y(d.y))
      .attr('r', r)
      .attr('fill', '#6565FF')
      .attr('fill-opacity', opacity)
      .attr('stroke', 'none');

  // y axis
  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(6))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('text-anchor', 'end');

  // x axis
  g.append('g').attr('class', 'axis')
    .attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickSize(4).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .call(a => a.selectAll('.tick line').style('stroke', '#aaaaaa'));
}

drawChart('#chart-worse',  { r: 4.5, opacity: 0.9 });
drawChart('#chart-better', { r: 2,   opacity: 0.12 });
</script>
</body>
</html>
