<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>네트워크 다이어그램</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #fff; padding: 40px 20px; }
    .container { display: inline-block; }
    h1   { font-size: 17px; line-height: 22px; font-weight: 700; color: #363636; padding-bottom: 5px; }
    .source { font-size: 13px; line-height: 17px; color: #777; margin-top: 8px; }
    .tooltip {
      position: fixed; background: rgba(255,255,255,0.95); border: 1px solid #c6c6c6;
      border-radius: 4px; padding: 10px 12px; pointer-events: none; opacity: 0;
      transition: opacity 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .tooltip-title { font-size: 14px; font-weight: 600; color: #454545; }
    .tooltip-body  { font-size: 13px; color: #636363; margin-top: 3px; }
    #export-btn {
      margin-top: 12px; padding: 8px 16px; font-size: 13px;
      background: #000; color: #fff; border: none; border-radius: 4px;
      cursor: pointer; font-family: 'Pretendard', sans-serif;
    }
    #export-btn:hover { background: #333; }
  </style>
</head>
<body>
<div class="container">
  <div style="border: 1px solid #aaa; padding: 16px; display: inline-block;">
    <h1>노드 연결 관계</h1>
    <div id="chart"></div>
    <p class="source">출처: 예시 데이터</p>
  </div><br>
  <button id="export-btn">SVG 다운로드</button>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="tt-title"></div>
  <div class="tooltip-body"  id="tt-body"></div>
</div>

<script>
  const nodeData = [
    { id: 'A', x: 25, y: 57, value:  70 },
    { id: 'B', x: 25, y: 35, value:  35 },
    { id: 'C', x: 48, y: 60, value:  55 },
    { id: 'D', x: 62, y: 30, value: 120 },
    { id: 'E', x: 43, y: 18, value:  18 },
    { id: 'F', x: 70, y: 12, value:  45 },
    { id: 'G', x: 70, y: 59, value:  16 },
    { id: 'H', x: 56, y: 74, value:  14 }
  ];

  const links = [
    { source: 'B', target: 'A' },
    { source: 'A', target: 'C' },
    { source: 'C', target: 'D' },
    { source: 'D', target: 'E' },
    { source: 'D', target: 'F' },
    { source: 'C', target: 'G' },
    { source: 'C', target: 'H' }
  ];

  /* ── 치수 ── */
  const W = 236, H = 200;
  const PAD = 24;

  /* ── 좌표 스케일 ── */
  const xScale = d3.scaleLinear()
    .domain([d3.min(nodeData, d => d.x), d3.max(nodeData, d => d.x)])
    .range([PAD, W - PAD]);

  const yScale = d3.scaleLinear()
    .domain([d3.min(nodeData, d => d.y), d3.max(nodeData, d => d.y)])
    .range([PAD, H - PAD]);

  /* ── 노드 크기 스케일 ── */
  const rScale = d3.scaleSqrt()
    .domain([0, d3.max(nodeData, d => d.value)])
    .range([4, 22]);

  /* ── 좌표 주입 ── */
  const nodeMap = Object.fromEntries(nodeData.map(d => [d.id, {
    ...d,
    px: xScale(d.x),
    py: yScale(d.y)
  }]));

  const svg = d3.select('#chart').append('svg')
    .attr('width', W).attr('height', H).attr('xmlns', 'http://www.w3.org/2000/svg');

  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('tt-title');
  const ttBody  = document.getElementById('tt-body');

  /* ── 엣지 ── */
  svg.append('g').selectAll('line')
    .data(links).join('line')
      .attr('x1', d => nodeMap[d.source].px)
      .attr('y1', d => nodeMap[d.source].py)
      .attr('x2', d => nodeMap[d.target].px)
      .attr('y2', d => nodeMap[d.target].py)
      .attr('stroke', '#aaaaaa')
      .attr('stroke-width', 1.5);

  /* ── 노드 ── */
  svg.append('g').selectAll('circle')
    .data(nodeData).join('circle')
      .attr('cx', d => nodeMap[d.id].px)
      .attr('cy', d => nodeMap[d.id].py)
      .attr('r', 0)
      .attr('fill', '#a5a2ff')
      .attr('stroke', '#6565FF')
      .attr('stroke-width', 1)
      .style('cursor', 'pointer')
      .on('mouseover', function(event, d) {
        d3.select(this).attr('fill', '#8480ee').attr('stroke-width', 1.5);
        const deg = links.filter(l => l.source === d.id || l.target === d.id).length;
        ttTitle.textContent = `노드 ${d.id}`;
        ttBody.textContent  = `값: ${d.value}  연결: ${deg}`;
        tooltip.style.opacity = '1';
        tooltip.style.left = (event.clientX + 12) + 'px';
        tooltip.style.top  = (event.clientY - 36) + 'px';
      })
      .on('mouseleave', function() {
        d3.select(this).attr('fill', '#a5a2ff').attr('stroke-width', 1);
        tooltip.style.opacity = '0';
      })
      .transition().duration(500).delay((_, i) => i * 60)
      .ease(d3.easeCubicInOut)
      .attr('r', d => rScale(d.value));

  /* ── SVG Export ── */
  function exportSVG(svgEl, fn = 'network.svg') {
    const st = document.createElement('style');
    st.textContent = `@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');text{font-family:'Pretendard','Noto Sans KR',sans-serif;}`;
    svgEl.insertBefore(st, svgEl.firstChild);
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', '#fff');
    svgEl.insertBefore(bg, svgEl.firstChild);
    const blob = new Blob([new XMLSerializer().serializeToString(svgEl)], { type: 'image/svg+xml' });
    Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: fn }).click();
    svgEl.removeChild(st); svgEl.removeChild(bg);
  }
  document.getElementById('export-btn').addEventListener('click', () => exportSVG(document.querySelector('svg')));
</script>
</body>
</html>
