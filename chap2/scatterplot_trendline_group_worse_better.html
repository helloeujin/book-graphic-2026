<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>추세선은 관계를 요약할 뿐, 증명하지 않는다</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: #fff;
    padding: 40px 20px;
  }
  .container { max-width: 620px; margin: 0; }

  h1 {
    font-size: 17px; line-height: 22px; font-weight: 700;
    color: #363636; padding-bottom: 5px;
  }
  .dek {
    font-size: 15px; line-height: 19px; font-weight: 400;
    color: #777777; padding-bottom: 10px;
  }

  .compare-wrap {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .panel {
    flex: 1 1 236px;
  }
  .panel-header {
    font-size: 13px;
    font-weight: 500;
    color: #363636;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid #ddd;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    padding: 3px 10px;
    color: #ffffff;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .badge-better { background: #37760a; }
  .badge-worse  { background: #b8351b; }

  .axis text { font-size: 13px; fill: #999999; }

  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    color: #636363;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .note, .source {
    font-size: 13px;
    line-height: 17px;
    font-weight: 400;
    color: #777777;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>추세선은 관계를 요약할 뿐, 증명하지 않는다</h1>
    <p class="dek">데이터가 여러 그룹으로 나뉘어 있다면, 하나의 추세선은 실제 패턴과 반대 방향을 가리킬 수도 있다</p>

    <div class="compare-wrap">
      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-worse">Worse</span>
          <span class="panel-desc">그룹 무시 + 추세선 하나</span>
        </div>
        <div id="chart-worse"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="badge badge-better">Better</span>
          <span class="panel-desc">그룹별 색 + 그룹별 추세선</span>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:#0b66d6"></span>그룹 A</span>
          <span class="legend-item"><span class="legend-dot" style="background:#c95c03"></span>그룹 B</span>
        </div>
        <div id="chart-better"></div>
      </div>
    </div>

    <p class="note">* 개념 설명을 위해 만든 가상 데이터입니다 (심슨의 역설 예시). 그룹 A·B는 각각 양의 관계를 갖지만, 합쳐서 보면 음의 관계처럼 보입니다.</p>
  </div>

<script>
// ── 데이터 생성 (고정 시드 — 매번 동일한 결과) ──────────────────
const rng = d3.randomLcg(0.19);
const rUniform = d3.randomUniform.source(rng);
const rNormal = d3.randomNormal.source(rng);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

const genAx = rUniform(20, 40);
const genBx = rUniform(60, 90);
const noise = rNormal(0, 1.6);

const groupA = [];
for (let i = 0; i < 25; i++) {
  const gx = genAx();
  groupA.push({ x: gx, y: clamp(5 + 0.55 * gx + noise(), 2, 29), group: 'A' });
}
const groupB = [];
for (let i = 0; i < 25; i++) {
  const gx = genBx();
  groupB.push({ x: gx, y: clamp(-10 + 0.30 * gx + noise(), 2, 29), group: 'B' });
}
const allData = groupA.concat(groupB);

// 단순 최소제곱 선형회귀
function linreg(points) {
  const n = points.length;
  const meanX = d3.mean(points, d => d.x);
  const meanY = d3.mean(points, d => d.y);
  let num = 0, den = 0;
  points.forEach(p => {
    num += (p.x - meanX) * (p.y - meanY);
    den += (p.x - meanX) ** 2;
  });
  const slope = num / den;
  const intercept = meanY - slope * meanX;
  return { slope, intercept };
}

// ── 공통 스케일 ────────────────────────────────────────────────
const W = 298, H = 200;
const margin = { top: 6, right: 30, bottom: 30, left: 50 };
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;

const x = d3.scaleLinear().domain([0, 100]).range([0, iW]);
const y = d3.scaleLinear().domain([0, 30]).range([iH, 0]);
const xTicks = [0, 30, 60, 90];
const yTicks = [0, 10, 20, 30];

function drawAxes(g) {
  g.selectAll('.grid').data(yTicks).join('line')
    .attr('class', 'grid')
    .attr('x1', 0).attr('x2', iW)
    .attr('y1', d => y(d)).attr('y2', d => y(d))
    .style('stroke', '#aaaaaa')
    .style('stroke-dasharray', '2')
    .style('stroke-opacity', 0.4);

  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(6))
    .call(a => a.select('.domain').remove())
    .selectAll('text').style('text-anchor', 'end');

  g.append('g').attr('class', 'axis')
    .attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickSize(4).tickPadding(8))
    .call(a => a.select('.domain').remove())
    .call(a => a.selectAll('.tick line').style('stroke', '#aaaaaa'));
}

function drawTrendLine(g, points, color) {
  const { slope, intercept } = linreg(points);
  const [x0, x1] = d3.extent(points, d => d.x);
  g.append('line')
    .attr('x1', x(x0)).attr('y1', y(slope * x0 + intercept))
    .attr('x2', x(x1)).attr('y2', y(slope * x1 + intercept))
    .attr('stroke', color)
    .attr('stroke-width', 2);
}

// ── Worse: 그룹 무시 + 추세선 하나 ─────────────────────────────
{
  const svg = d3.select('#chart-worse').append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  drawAxes(g);

  g.append('g')
    .selectAll('circle')
    .data(allData)
    .join('circle')
      .attr('cx', d => x(d.x))
      .attr('cy', d => y(d.y))
      .attr('r', 3.5)
      .attr('fill', '#a4a4a4')
      .attr('fill-opacity', 0.6)
      .attr('stroke', 'none');

  drawTrendLine(g, allData, '#6565FF');
}

// ── Better: 그룹별 색 + 그룹별 추세선 ──────────────────────────
{
  const svg = d3.select('#chart-better').append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  drawAxes(g);

  const groupColor = { A: '#0b66d6', B: '#c95c03' };

  g.append('g')
    .selectAll('circle')
    .data(allData)
    .join('circle')
      .attr('cx', d => x(d.x))
      .attr('cy', d => y(d.y))
      .attr('r', 3.5)
      .attr('fill', d => groupColor[d.group])
      .attr('fill-opacity', 0.6)
      .attr('stroke', 'none');

  drawTrendLine(g, groupA, groupColor.A);
  drawTrendLine(g, groupB, groupColor.B);
}
</script>
</body>
</html>
