<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>워플 차트 비교</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Pretendard','Noto Sans KR',sans-serif; background:#fff; padding:40px 20px; }
    .panels { display:flex; gap:24px; align-items:flex-start; }
    .panel  { display:inline-block; }
    .panel-label {
      font-size: 13px; font-weight: 500; color: #363636;
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px; margin-bottom: 14px;
      border-bottom: 1px solid #ddd; width: 236px;
    }
    .badge {
      font-size: 12px; font-weight: 700; border-radius: 4px;
      padding: 3px 10px; color: #fff;
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge-worse  { background: #b8351b; }
    .badge-better { background: #37760a; }

    /* Do 차트 수치 레이블 */
    .chart-value {
      font-size: 32px; font-weight: 700; color: #6565FF;
      text-align: center; margin-top: 10px; letter-spacing: -0.5px;
    }
    .chart-sub {
      font-size: 12px; color: #636363;
      text-align: center; margin-top: 3px;
    }

    /* Don't 차트 범례 */
    .legend-small {
      display: flex; flex-wrap: wrap; gap: 4px 10px;
      margin-top: 10px; width: 236px;
    }
    .legend-sm-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: #636363;
    }
    .legend-sm-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    }

    .source { font-size: 12px; color: #999; margin-top: 16px; }
    #export-btn {
      display: inline-block; margin-top: 10px; padding: 6px 14px; font-size: 12px;
      background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="panels">

  <!-- Don't -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-worse">Don't</span>
      항목마다 다른 색
    </p>
    <div id="chart-dont"></div>
    <div class="legend-small" id="legend-dont"></div>
  </div>

  <!-- Do -->
  <div class="panel">
    <p class="panel-label">
      <span class="badge badge-better">Do</span>
      단일 비율 강조색 + 회색
    </p>
    <div id="chart-do"></div>
    <p class="chart-value">35%</p>
    <p class="chart-sub">찬성 비율</p>
  </div>

</div>

<p class="source">* 예시 데이터</p>
<button id="export-btn">SVG 다운로드</button>

<script>
const FONT = "Pretendard,'Noto Sans KR',sans-serif";
const W = 236, H = 178;
const CELL = 13, GAP = 2;
const GRID = CELL * 10 + GAP * 9;          // 148px
const OX   = Math.round((W - GRID) / 2);   // 44px
const OY   = Math.round((H - GRID) / 2);   // 15px

// ── 데이터 ────────────────────────────────────────────────────

// Don't: 5가지 항목, 각기 다른 색
const dontSegments = [
  { label: '찬성',   count: 35, color: '#cc2b0c' },
  { label: '반대',   count: 28, color: '#0b66d6' },
  { label: '중립',   count: 20, color: '#3b8601' },
  { label: '미응답', count: 12, color: '#824cd5' },
  { label: '기타',   count:  5, color: '#d8d8d8' },
];

// Do: 찬성 35% 강조, 나머지 회색
const doSegments = [
  { count: 35, color: '#6565FF' },
  { count: 65, color: '#d8d8d8' },
];

// ── 워플 차트 그리기 ──────────────────────────────────────────
function drawWaffle(containerId, segments) {
  // 셀 배열 생성 (100개)
  const cells = [];
  segments.forEach(seg => {
    for (let i = 0; i < seg.count; i++) cells.push(seg.color);
  });

  const svg = d3.select(`#${containerId}`).append('svg')
    .attr('width', W).attr('height', H);

  svg.selectAll('rect')
    .data(cells)
    .join('rect')
      .attr('x',  (d, i) => OX + (i % 10) * (CELL + GAP))
      .attr('y',  (d, i) => OY + Math.floor(i / 10) * (CELL + GAP))
      .attr('width',  CELL)
      .attr('height', CELL)
      .attr('rx', 2).attr('ry', 2)
      .attr('fill', d => d)
      .attr('opacity', 0)
      .transition()
      .delay((d, i) => i * 8)
      .duration(150)
      .attr('opacity', 1);

  return svg.node();
}

// ── Don't 범례 ────────────────────────────────────────────────
const legendEl = document.getElementById('legend-dont');
dontSegments.forEach(seg => {
  const item = document.createElement('div');
  item.className = 'legend-sm-item';
  item.innerHTML = `
    <div class="legend-sm-dot" style="background:${seg.color}"></div>
    ${seg.label} ${seg.count}%
  `;
  legendEl.appendChild(item);
});

// ── 렌더링 ───────────────────────────────────────────────────
drawWaffle('chart-dont', dontSegments);
drawWaffle('chart-do',   doSegments);

// ── SVG 내보내기 ──────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  document.querySelectorAll('svg').forEach((svg, i) => {
    const clone = svg.cloneNode(true);
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width','100%'); bg.setAttribute('height','100%'); bg.setAttribute('fill','#fff');
    clone.insertBefore(bg, clone.firstChild);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type:'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `waffle-${i === 0 ? 'dont' : 'do'}.svg`;
    a.click(); URL.revokeObjectURL(a.href);
  });
});
</script>
</body>
</html>
