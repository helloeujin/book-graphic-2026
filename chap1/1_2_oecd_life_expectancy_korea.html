// Build series array
const series = columns.map((name, ci) => ({
  name,
  displayName: name === 'South Korea' ? '한국' : name,
  isKorea: name === 'South Korea',
  values: years.map((yr, yi) => ({ year: yr, value: rawMatrix[yi][ci] }))
}));

// Sort: gray first, World second, Korea last (renders on top)
series.sort((a, b) => {
  const rank = s => s.isKorea ? 2 : s.name === 'World' ? 1 : 0;
  return rank(a) - rank(b);
});

const KOREA_COLOR = '#6565FF';
const HIGHLIGHT_COLOR = '#888888';
const GRAY        = '#cccccc';

// Dimensions — full width
const W = 520, H = 380;
const margin = { top: 0, right: 80, bottom: 36, left: 30 };
const iW = W - margin.left - margin.right;
const iH = H - margin.top - margin.bottom;

const svg = d3.select('#chart')
  .append('svg')
  .attr('width', W)
  .attr('height', H);

const g = svg.append('g')
  .attr('transform', `translate(${margin.left},${margin.top})`);

// Scales
const x = d3.scaleLinear().domain([1950, 2023]).range([0, iW]);
const y = d3.scaleLinear().domain([20, 90]).range([iH, 0]);
const yTicks = [20, 40, 60, 80];
const topTick = yTicks[yTicks.length - 1];

// Grid (zero excluded per style guide §15 — but no zero here, all positive)
g.selectAll('.grid').data(yTicks).join('line')
  .attr('class', 'grid')
  .attr('x1', d => d === topTick ? 14 : 0)
  .attr('x2', iW)
  .attr('y1', d => y(d)).attr('y2', d => y(d))
  .style('stroke', '#aaaaaa')
  .style('stroke-dasharray', '2')
  .style('stroke-opacity', 0.4);

// X axis
const xAxis = g.append('g')
  .attr('transform', `translate(0,${iH})`)
  .call(
    d3.axisBottom(x)
      .tickValues([1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020])
      .tickFormat(d3.format('d'))
      .tickSize(4).tickPadding(8)
  );
xAxis.select('.domain').remove();
xAxis.selectAll('.tick line').style('stroke', '#aaaaaa');
xAxis.selectAll('text').style('font-size', '13px').style('fill', '#999999').style('font-family', 'Pretendard, sans-serif');

// Y axis
const yAxis = g.append('g')
  .call(d3.axisLeft(y).tickValues(yTicks).tickSize(0).tickPadding(6).tickFormat(d => `${d}`));
yAxis.select('.domain').remove();
yAxis.selectAll('text').style('font-size', '13px').style('fill', '#666666').style('font-family', 'Pretendard, sans-serif');

// Unit label (top tick)
g.append('text')
  .attr('x', -6).attr('y', y(topTick))
  .attr('dy', '0.32em').attr('dx', 2)
  .style('text-anchor', 'start')
  .style('font-size', '13px').style('fill', '#666666')
  .style('font-family', 'Pretendard, sans-serif')
  .text('세');
g.append('defs').append('clipPath').attr('id', 'clip')
  .append('rect')
  .attr('width', 0).attr('height', iH + 20).attr('y', -10)
  .transition().duration(800).ease(d3.easeCubicInOut)
  .attr('width', iW + 10);

// Line generator
const line = d3.line()
  .defined(d => d.value != null && !isNaN(d.value))
  .x(d => x(d.year))
  .y(d => y(d.value))
  .curve(d3.curveMonotoneX);

const isHighlight = s => s.name === 'World';

// Draw all lines
series.forEach(s => {
  g.append('path')
    .datum(s.values)
    .attr('fill', 'none')
    .attr('stroke', s.isKorea ? KOREA_COLOR : isHighlight(s) ? HIGHLIGHT_COLOR : GRAY)
    .attr('stroke-width', s.isKorea || isHighlight(s) ? 2.5 : 1.1)
    .attr('stroke-opacity', s.isKorea || isHighlight(s) ? 1 : 0.55)
    .attr('clip-path', 'url(#clip)')
    .attr('d', line);
});

// Korea end label + dot
setTimeout(() => {
  const ks = series.find(s => s.isKorea);
  const last = ks.values[ks.values.length - 1];
  const first = ks.values[0];

  // Korea start dot
  g.append('circle')
    .attr('cx', x(first.year)).attr('cy', y(first.value))
    .attr('r', 4).attr('fill', KOREA_COLOR)
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  // Korea end dot
  g.append('circle')
    .attr('cx', x(last.year)).attr('cy', y(last.value))
    .attr('r', 4).attr('fill', KOREA_COLOR)
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  // Korea end label
  g.append('text')
    .attr('x', x(last.year) + 8).attr('y', y(last.value) - 7)
    .attr('dy', '0.35em')
    .style('font-size', '14px').style('font-weight', '700')
    .style('fill', KOREA_COLOR)
    .style('font-family', 'Pretendard, sans-serif')
    .text('한국');

  // Korea end value
  g.append('text')
    .attr('x', x(last.year) + 8).attr('y', y(last.value) + 9)
    .attr('dy', '0.35em')
    .style('font-size', '13px').style('font-weight', '400')
    .style('fill', KOREA_COLOR)
    .style('font-family', 'Pretendard, sans-serif')
    .text(`${last.value.toFixed(1)}세`);

  // World
  const ws = series.find(s => s.name === 'World');
  const wFirst = ws.values[0];
  const wLast = ws.values[ws.values.length - 1];

  // World start dot
  g.append('circle')
    .attr('cx', x(wFirst.year)).attr('cy', y(wFirst.value))
    .attr('r', 4).attr('fill', HIGHLIGHT_COLOR)
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  // World end dot
  g.append('circle')
    .attr('cx', x(wLast.year)).attr('cy', y(wLast.value))
    .attr('r', 4).attr('fill', HIGHLIGHT_COLOR)
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  // World end label
  g.append('text')
    .attr('x', x(wLast.year) + 8).attr('y', y(wLast.value) - 7)
    .attr('dy', '0.35em')
    .style('font-size', '14px').style('font-weight', '700')
    .style('fill', HIGHLIGHT_COLOR)
    .style('font-family', 'Pretendard, sans-serif')
    .text('세계 평균');

  // World end value
  g.append('text')
    .attr('x', x(wLast.year) + 8).attr('y', y(wLast.value) + 9)
    .attr('dy', '0.35em')
    .style('font-size', '13px').style('font-weight', '400')
    .style('fill', HIGHLIGHT_COLOR)
    .style('font-family', 'Pretendard, sans-serif')
    .text(`${wLast.value.toFixed(1)}세`);
}, 830);

// SVG Export
function exportSVG(svgEl, filename) {
  const style = document.createElement('style');
  style.textContent = `@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css'); text { font-family: 'Pretendard', sans-serif; }`;
  svgEl.insertBefore(style, svgEl.firstChild);
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', '#FFFFFF');
  svgEl.insertBefore(bg, svgEl.firstChild);
  const blob = new Blob([new XMLSerializer().serializeToString(svgEl)], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: filename }).click();
  URL.revokeObjectURL(url);
}
document.getElementById('export-btn').addEventListener('click', () => {
  exportSVG(document.querySelector('svg'), 'korea_life_expectancy.svg');
});
