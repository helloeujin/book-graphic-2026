<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>라인 차트</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Pretendard','Noto Sans KR',sans-serif; background:#fff; padding:40px 20px; }
    .container { display:inline-block; }
    h1   { font-size:17px; line-height:22px; font-weight:700; color:#363636; padding-bottom:5px; }
    .legend { display:flex; gap:12px; margin-bottom:4px; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:13px; color:#363636; }
    .legend-line { width:16px; height:2px; display:inline-block; }
    .source { font-size:13px; line-height:17px; color:#777; margin-top:8px; }
    .tooltip {
      position:fixed; background:rgba(255,255,255,0.95); border:1px solid #c6c6c6;
      border-radius:4px; padding:10px 12px; pointer-events:none; opacity:0;
      transition:opacity 0.15s; box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }
    .tooltip-title { font-size:14px; font-weight:600; color:#454545; }
    .tooltip-body  { font-size:13px; color:#636363; margin-top:3px; }
    #export-btn {
      margin-top:12px; padding:8px 16px; font-size:13px;
      background:#000; color:#fff; border:none; border-radius:4px;
      cursor:pointer; font-family:'Pretendard',sans-serif;
    }
    #export-btn:hover { background:#333; }
  </style>
</head>
<body>
<div class="container">
  <div style="border:1px solid #aaa; padding:16px; display:inline-block;">
    <h1>연도별 추이</h1>
    <div class="legend">
      <span class="legend-item"><span class="legend-line" style="background:#6565FF;"></span>계열 A</span>
      <span class="legend-item"><span class="legend-line" style="background:#a4a4a4;"></span>계열 B</span>
    </div>
    <div id="chart"></div>
    <p class="source">출처: 예시 데이터</p>
  </div><br>
  <button id="export-btn">SVG 다운로드</button>
</div>
<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="tt-title"></div>
  <div class="tooltip-body"  id="tt-body"></div>
</div>
<script>
  const years  = [2000, 2005, 2010, 2015, 2020];
  const series = [
    { name:'계열 A', color:'#6565FF', values:[4.2, 6.8,  9.1, 11.5, 14.3] },
    { name:'계열 B', color:'#a4a4a4', values:[7.5, 8.2,  7.9,  9.4, 10.1] }
  ];

  const W = 236, H = 200;
  const M = { top:6, right:40, bottom:30, left:36 };
  const iW = W - M.left - M.right;
  const iH = H - M.top  - M.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width',W).attr('height',H).attr('xmlns','http://www.w3.org/2000/svg');
  const g = svg.append('g').attr('transform',`translate(${M.left},${M.top})`);

  /* 스케일 — y baseline 2.5 */
  const xScale = d3.scaleLinear().domain([2000,2020]).range([0,iW]);
  const yMin   = 2.5;
  const yMax   = Math.ceil(d3.max(series.flatMap(s=>s.values)) / 5) * 5;
  const yScale = d3.scaleLinear().domain([yMin,yMax]).range([iH,0]);
  const yTicks = d3.range(5, yMax+1, 5);

  /* 그리드 */
  g.append('g').selectAll('line').data(yTicks).join('line')
    .attr('x1',0).attr('x2',iW).attr('y1',d=>yScale(d)).attr('y2',d=>yScale(d))
    .style('stroke','#aaaaaa').style('stroke-dasharray','2').style('stroke-opacity',0.4);

  /* Y축 */
  g.append('g')
    .call(d3.axisLeft(yScale).tickValues(yTicks).tickSize(0).tickPadding(8))
    .call(a=>a.select('.domain').remove())
    .selectAll('text').style('font-size','13px').style('fill','#999999')
    .style('font-family',"Pretendard,'Noto Sans KR',sans-serif");

  /* X축 */
  g.append('g').attr('transform',`translate(0,${iH})`)
    .call(d3.axisBottom(xScale).tickValues(years).tickFormat(d3.format('d')).tickSize(4).tickPadding(8))
    .call(a=>a.select('.domain').remove())
    .selectAll('text').style('font-size','13px').style('fill','#999999')
    .style('font-family',"Pretendard,'Noto Sans KR',sans-serif");

  const lineGen = d3.line().x((_,i)=>xScale(years[i])).y(v=>yScale(v)).curve(d3.curveMonotoneX);

  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('tt-title');
  const ttBody  = document.getElementById('tt-body');

  series.forEach(s => {
    const path = g.append('path').datum(s.values)
      .attr('fill','none').attr('stroke',s.color)
      .attr('stroke-width',2).attr('stroke-linejoin','round').attr('d',lineGen);
    const len = path.node().getTotalLength();
    path.attr('stroke-dasharray',`${len} ${len}`).attr('stroke-dashoffset',len)
      .transition().duration(800).ease(d3.easeCubicInOut).attr('stroke-dashoffset',0);

    /* 끝 레이블 */
    g.append('text')
      .attr('x',iW+5).attr('y',yScale(s.values.at(-1)))
      .attr('dominant-baseline','central').attr('font-size','12px').attr('fill',s.color)
      .attr('font-family',"Pretendard,'Noto Sans KR',sans-serif")
      .attr('opacity',0).text(s.name)
      .transition().delay(800).duration(200).attr('opacity',1);
  });

  /* 겹침 방지 */
  setTimeout(() => {
    const MIN_GAP = 14;
    const els = svg.selectAll('text').filter(function(){
      return +d3.select(this).attr('x') > iW + M.left;
    }).nodes();
    const ys = els.map(el=>+d3.select(el).attr('y')).sort((a,b)=>a-b);
    for (let i=1; i<ys.length; i++) if (ys[i]-ys[i-1]<MIN_GAP) ys[i]=ys[i-1]+MIN_GAP;
    els.forEach((el,i)=>d3.select(el).attr('y',ys[i]));
  }, 850);

  /* 투명 오버레이 tooltip */
  series.forEach(s => {
    g.append('rect').attr('width',iW).attr('height',iH).attr('fill','transparent').style('cursor','crosshair')
      .on('mousemove', function(event) {
        const mx = d3.pointer(event,this)[0];
        const i  = Math.max(0,Math.min(years.length-1, Math.round((xScale.invert(mx)-2000)/5)));
        ttTitle.textContent = `${s.name} · ${years[i]}년`;
        ttBody.textContent  = `값: ${s.values[i]}`;
        tooltip.style.opacity = '1';
        tooltip.style.left = (event.clientX+12)+'px';
        tooltip.style.top  = (event.clientY-36)+'px';
      })
      .on('mouseleave',()=>{ tooltip.style.opacity='0'; });
  });

  function exportSVG(svgEl, fn='line_chart.svg') {
    const st = document.createElement('style');
    st.textContent=`@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');text{font-family:'Pretendard','Noto Sans KR',sans-serif;}`;
    svgEl.insertBefore(st,svgEl.firstChild);
    const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','#fff');
    svgEl.insertBefore(bg,svgEl.firstChild);
    const blob=new Blob([new XMLSerializer().serializeToString(svgEl)],{type:'image/svg+xml'});
    Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:fn}).click();
    svgEl.removeChild(st);svgEl.removeChild(bg);
  }
  document.getElementById('export-btn').addEventListener('click',()=>exportSVG(document.querySelector('svg')));
</script>
</body>
</html>
